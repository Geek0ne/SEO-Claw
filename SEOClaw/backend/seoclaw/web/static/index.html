<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEOClaw —— 站点 SEO 体检</title>
<style>
/*
 * 设计取向：现代企业级。
 *   浅色底、克制的单色强调、真实的分隔线、大量留白。
 *   不用渐变、不发光、不用紫蓝——那是「AI 生成感」的来源。
 */
:root{
  --bg:#fbfbfc; --surface:#fff; --ink:#16181d; --ink-2:#3f444e;
  --muted:#6b7280; --faint:#9aa1ad; --line:#e8eaee; --line-2:#f1f2f5;
  --accent:#1a56db; --accent-soft:#eef2ff;
  --crit:#b42318; --high:#b54708; --med:#a15c07; --low:#175cd3; --info:#475467;
  --ok-1:#067647; --ok-2:#b54708; --ok-3:#b42318;
  --radius:6px;
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Inter",
  "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
.wrap{max-width:940px;margin:0 auto;padding:0 24px 88px}
a{color:var(--accent)}

/* ── 顶栏：一条线，不是发光卡片 ── */
header{padding:44px 0 30px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:22px}
.mark{width:22px;height:22px;border-radius:5px;background:var(--ink);
  color:#fff;font-size:12px;display:grid;place-items:center;font-weight:600;
  align-self:center}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.1px}
.brand span{font-size:12.5px;color:var(--faint)}
h1{font-size:30px;font-weight:600;letter-spacing:-.7px;line-height:1.25;margin:0 0 10px}
h1 em{font-style:normal;color:var(--accent)}
.lede{color:var(--muted);margin:0;font-size:15px}

/* ── 表单：卡片用真边框，不用阴影堆叠 ── */
.card{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);margin:24px 0 16px}
.card-hd{padding:16px 22px;border-bottom:1px solid var(--line-2);
  font-size:13px;font-weight:600;letter-spacing:.2px}
.card-bd{padding:22px}

.field{display:block;margin-bottom:18px}
.field:last-of-type{margin-bottom:0}
.lbl{display:block;font-size:12px;font-weight:500;color:var(--ink-2);
  margin-bottom:7px;letter-spacing:.1px}
.hint{color:var(--faint);font-size:11.5px;font-weight:400;margin-left:6px}

input[type=text]{
  width:100%;padding:11px 13px;font-size:14.5px;color:var(--ink);
  border:1px solid #d6d9e0;border-radius:var(--radius);background:var(--surface);
  transition:border-color .12s,box-shadow .12s;
}
input[type=text]::placeholder{color:var(--faint)}
input[type=text]:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(26,86,219,.10)}

select{width:100%;padding:10px 12px;font-size:14px;color:var(--ink);
  border:1px solid #d6d9e0;border-radius:var(--radius);background:var(--surface);
  cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath fill='%236b7280' d='M0 0h10L5 6z'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center}
select:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(26,86,219,.10)}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:660px){.cols{grid-template-columns:1fr}}

/* 分段控件：像系统设置里那种，不是彩色胶囊 */
.seg{display:flex;border:1px solid #d6d9e0;border-radius:var(--radius);
  overflow:hidden;background:var(--surface)}
.seg label{flex:1;text-align:center;padding:9px 4px;font-size:13px;
  color:var(--muted);cursor:pointer;transition:.12s;user-select:none;
  border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg label:hover{background:var(--line-2)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--accent);font-weight:600}
.seg label:has(input:checked){background:var(--accent-soft)}

/* 勾选项：原生 checkbox，不自绘圆角胶囊 */
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 0;
  border-top:1px solid var(--line-2);cursor:pointer}
.opt:first-child{border-top:0}
.opt input{width:15px;height:15px;margin:2px 0 0;accent-color:var(--accent);
  cursor:pointer;flex:0 0 auto}
.opt b{display:block;font-size:13.5px;font-weight:500}
.opt small{display:block;color:var(--faint);font-size:12px;margin-top:1px}

.btn{padding:11px 22px;font-size:14px;font-weight:550;border-radius:var(--radius);
  border:1px solid transparent;cursor:pointer;transition:.12s;font-family:inherit}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover:not(:disabled){background:#000}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:var(--surface);color:var(--ink-2);border-color:#d6d9e0}
.btn-ghost:hover{background:var(--line-2);color:var(--ink)}
.actions{display:flex;gap:10px;margin-top:22px;padding-top:20px;
  border-top:1px solid var(--line-2)}

.examples{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:16px}
.examples span{font-size:12px;color:var(--faint);margin-right:3px}
.examples button{padding:4px 10px;font-size:12px;border-radius:4px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  cursor:pointer;font-family:inherit;transition:.12s}
.examples button:hover{border-color:#c9cdd6;color:var(--ink)}

/* ── 状态 ── */
.note{border-radius:var(--radius);padding:13px 15px;font-size:13.5px;
  border:1px solid var(--line);background:var(--surface);margin-bottom:14px;
  line-height:1.65}
.note.err{background:#fef3f2;border-color:#fecdca;color:#7a271a}
.note.warn{background:#fffaeb;border-color:#fedf89;color:#93370d}
.note.ok{background:#ecfdf3;border-color:#abefc6;color:#054f31}
.note b{font-weight:600}

.progress{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:20px 22px;margin-bottom:14px}
.pg-head{display:flex;align-items:center;gap:9px;margin-bottom:15px;
  font-size:14px;font-weight:500}
.spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.pg-track{height:3px;background:var(--line-2);border-radius:2px;overflow:hidden;
  margin-bottom:12px}
.pg-track>i{display:block;height:100%;width:30%;background:var(--accent);
  animation:sl 1.6s ease-in-out infinite}
@keyframes sl{0%{margin-left:-30%}100%{margin-left:100%}}
.pg-log{display:flex;justify-content:space-between;font-size:12.5px;
  color:var(--muted);font-variant-numeric:tabular-nums}

/* ── 结果：分数用横条与大数字，不用环形发光 ── */
.headline{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:24px;margin-bottom:16px}
.hl-top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  margin-bottom:20px}
.hl-score{font-size:46px;font-weight:600;letter-spacing:-2px;line-height:1}
.hl-score.g1{color:var(--ok-1)} .hl-score.g2{color:var(--ok-2)}
.hl-score.g3{color:var(--ok-3)} .hl-score.g4{color:var(--crit)}
.hl-verdict{font-size:16px;font-weight:550}
.hl-meta{font-size:13px;color:var(--muted);margin-left:auto;
  font-variant-numeric:tabular-nums}

.meter{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;
  margin-bottom:20px}
.meter>i{display:block;height:100%;border-radius:3px;transition:width .7s ease}
.meter>i.g1{background:var(--ok-1)} .meter>i.g2{background:var(--ok-2)}
.meter>i.g3{background:var(--ok-3)} .meter>i.g4{background:var(--crit)}

.dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:4px;
  overflow:hidden}
.dim{background:var(--surface);padding:11px 12px}
.dim label{display:block;font-size:11px;color:var(--faint);margin-bottom:5px}
.dim .t{height:3px;background:var(--line-2);border-radius:2px;overflow:hidden;
  margin-bottom:6px}
.dim .t>i{display:block;height:100%;background:var(--ink-2)}
.dim em{font-style:normal;font-size:12.5px;font-weight:550;
  font-variant-numeric:tabular-nums}

/* 筛选 */
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:26px 0 12px}
.filters .lb{font-size:12px;color:var(--faint);margin-right:4px}
.f{padding:5px 11px;font-size:12.5px;border-radius:4px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  font-family:inherit;transition:.12s}
.f:hover{border-color:#c9cdd6;color:var(--ink)}
.f.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
.f.on b{font-weight:600}

/* 问题条目：像 issue tracker，不用彩色药丸 */
.issue{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);margin-bottom:8px;transition:border-color .12s}
.issue:hover{border-color:#d0d4dc}
.issue[open]{border-color:#d0d4dc}
.issue>summary{cursor:pointer;padding:13px 16px;display:flex;gap:12px;
  align-items:center;list-style:none}
.issue>summary::-webkit-details-marker{display:none}
.issue[open]>summary{border-bottom:1px solid var(--line-2)}
.sev{font-size:11px;font-weight:600;padding:2px 7px;border-radius:3px;
  flex:0 0 auto;letter-spacing:.2px;border:1px solid}
.sev.critical{color:var(--crit);border-color:#fecdca;background:#fef3f2}
.sev.high{color:var(--high);border-color:#fedf89;background:#fffaeb}
.sev.medium{color:var(--med);border-color:#fde9c3;background:#fffcf5}
.sev.low{color:var(--low);border-color:#b2ddff;background:#eff8ff}
.sev.info{color:var(--info);border-color:var(--line);background:var(--line-2)}
.ttl{flex:1;font-size:14px;font-weight:500;min-width:0}
.cnt{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;flex:0 0 auto}
.caret{color:var(--faint);font-size:10px;transition:transform .15s;flex:0 0 auto}
.issue[open] .caret{transform:rotate(90deg)}

.body{padding:14px 16px;font-size:13.5px;color:var(--ink-2);line-height:1.7}
.body p{margin:0 0 12px}
.blabel{font-size:11px;color:var(--faint);margin-bottom:5px;
  letter-spacing:.3px;text-transform:uppercase;font-weight:600}
.fix{background:#f8f9fb;border:1px solid var(--line-2);border-left:2px solid var(--accent);
  border-radius:0 4px 4px 0;padding:10px 12px;color:var(--ink);font-size:13.5px}
pre{margin:0;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12.5px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
  color:var(--ink-2);background:var(--line-2);padding:2px 6px;border-radius:3px}
.url{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
  color:var(--low);word-break:break-all}

footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);
  color:var(--faint);font-size:12.5px;text-align:center;line-height:1.9}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);
  background:var(--ink);color:#fff;padding:9px 16px;border-radius:var(--radius);
  font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand">
    <span class="mark">S</span><b>SEOClaw</b><span>站点 SEO 体检</span>
  </div>
  <h1>扫一遍，告诉你<em>先改哪几件</em></h1>
  <p class="lede">43 项确定性检查，每条结论都能追到原文证据。没把握的会直接标注，不猜。</p>
</header>

<form class="card" id="f">
  <div class="card-hd">开始体检</div>
  <div class="card-bd">

    <label class="field">
      <span class="lbl">网址</span>
      <input type="text" id="url" placeholder="example.com" autocomplete="off"
             spellcheck="false" required>
    </label>

    <div class="cols">
      <label class="field">
        <span class="lbl">抓取页数</span>
        <select id="max_pages">
          <option value="10">10 页 · 快速看看</option>
          <option value="30" selected>30 页 · 够看结构</option>
          <option value="80">80 页 · 更全</option>
          <option value="200">200 页 · 较慢</option>
        </select>
      </label>
      <div class="field">
        <span class="lbl">抓取深度</span>
        <div class="seg">
          <label><input type="radio" name="depth" value="1"><span>仅首页</span></label>
          <label><input type="radio" name="depth" value="2" checked><span>2 层</span></label>
          <label><input type="radio" name="depth" value="6"><span>全站</span></label>
        </div>
      </div>
    </div>

    <div class="cols">
      <label class="field">
        <span class="lbl">市场</span>
        <select id="market">
          <option value="base" selected>通用（Google 系）</option>
          <option value="google">Google 生态</option>
          <option value="baidu">百度生态</option>
          <option value="cnh_eco">中文生态（微信等）</option>
        </select>
      </label>
      <div class="field">
        <span class="lbl">选项</span>
        <label class="opt">
          <input type="checkbox" id="render_js">
          <span><b>渲染 JavaScript</b>
          <small>SPA / 前端渲染的站点建议开，慢很多</small></span>
        </label>
        <label class="opt">
          <input type="checkbox" id="robots" checked>
          <span><b>遵守 robots.txt</b>
          <small>关掉可扫到不该扫的页面，仅自测用</small></span>
        </label>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="go" type="submit">开始体检</button>
      <button class="btn btn-ghost" id="reset" type="button">重置</button>
    </div>

    <div class="examples">
      <span>试试</span>
      <button type="button" data-u="example.com">example.com</button>
      <button type="button" data-u="www.rust-lang.org">rust-lang.org</button>
      <button type="button" data-u="www.python.org">python.org</button>
      <button type="button" data-u="go.dev">go.dev</button>
    </div>

  </div>
</form>

<div id="out"></div>

<footer>
  规则永不依赖 LLM · 每条结论都能追到原文证据<br>
  没抓到页面 ≠ 没问题 · 没覆盖到的检查项一律不装作查过了
</footer>

</div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const out=$('out'), goBtn=$('go');
const SEV=['critical','high','medium','low','info'];
const SEV_CN={critical:'致命',high:'高',medium:'中',low:'低',info:'提示'};
const DIM_CN={crawlability:'可抓取',architecture:'结构',content:'内容',
  performance:'性能',structured_data:'结构化数据',trust:'信任'};
let filter='all', last=null, timer=null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function el(h){const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2100);}

document.querySelectorAll('.examples button').forEach(b=>b.addEventListener('click',()=>{
  $('url').value=b.dataset.u;$('url').focus();}));

$('reset').addEventListener('click',()=>{
  if(timer){clearTimeout(timer);timer=null;}
  clearInterval(window._tk);
  $('url').value='';out.innerHTML='';last=null;
  goBtn.disabled=false;goBtn.textContent='开始体检';
});

$('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const url=$('url').value.trim();
  if(!url){toast('先填个网址');return;}
  if(timer){clearTimeout(timer);timer=null;}

  goBtn.disabled=true;goBtn.textContent='提交中…';
  out.innerHTML=loading('正在提交…','连接服务');
  window._t0=Date.now();startClock();

  try{
    const r=await fetch('/api/v1/web/quick-scan',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        url,
        max_pages:Number($('max_pages').value),
        market:$('market').value,
        max_depth:Number(document.querySelector('input[name=depth]:checked').value),
        respect_robots:$('robots').checked,
        render_js:$('render_js').checked,
      })
    });
    let d=null;try{d=await r.json();}catch(_){}
    if(!r.ok)throw new Error((d&&d.detail)?String(d.detail):('HTTP '+r.status));
    out.innerHTML=loading('正在扫描 '+esc(d.domain),'已排队，正在抓取页面…');
    poll(d.job_id,0);
  }catch(err){
    clearInterval(window._tk);
    out.innerHTML='';
    out.appendChild(el(`<div class="note err"><b>提交失败：</b>${esc(err.message)}</div>`));
    goBtn.disabled=false;goBtn.textContent='开始体检';
  }
});

function loading(title,note){
  return `<div class="progress">
    <div class="pg-head"><span class="spin"></span>${title}</div>
    <div class="pg-track"><i></i></div>
    <div class="pg-log"><span id="pg-note">${note}</span><span id="el">0s</span></div>
  </div>`;
}
function startClock(){
  clearInterval(window._tk);
  window._tk=setInterval(()=>{
    const e=$('el');
    if(e)e.textContent=Math.round((Date.now()-window._t0)/1000)+'s';
  },500);
}

async function poll(jobId,tries){
  const started=window._t0||Date.now();
  if(Date.now()-started>5*60*1000){
    clearInterval(window._tk);
    out.innerHTML='';
    out.appendChild(el(`<div class="note warn"><b>等太久了，这次没等到结果。</b><br>
      站点可能在拦自动化访问，或者页面特别多。把「抓取页数」调到 10 再试。</div>`));
    goBtn.disabled=false;goBtn.textContent='开始体检';
    return;
  }
  const steps=['已排队，正在抓取页面…','正在解析页面…','正在跑 43 项检查…','快好了…'];
  const n=$('pg-note');
  if(n&&tries%3===0)n.textContent=steps[Math.min(3,Math.floor(tries/3))];

  try{
    const r=await fetch('/api/v1/web/jobs/'+jobId);
    if(!r.ok)throw new Error('任务不存在或服务已重启');
    const d=await r.json();
    if(d.status==='done'){clearInterval(window._tk);render(d.report);return;}
    if(d.status==='failed'){
      clearInterval(window._tk);out.innerHTML='';
      out.appendChild(el(`<div class="note err"><b>扫描失败：</b>${esc(d.error||'未知错误')}</div>`));
      goBtn.disabled=false;goBtn.textContent='开始体检';return;
    }
    timer=setTimeout(()=>poll(jobId,tries+1),1100);
  }catch(err){
    clearInterval(window._tk);out.innerHTML='';
    out.appendChild(el(`<div class="note warn">${esc(err.message)}——请重新发起一次。</div>`));
    goBtn.disabled=false;goBtn.textContent='开始体检';
  }
}

function render(rep){
  goBtn.disabled=false;goBtn.textContent='重新体检';
  out.innerHTML='';
  if(!rep){out.appendChild(el('<div class="note warn">没有拿到报告。</div>'));return;}

  // 一页没抓到时 health_score 是 null，不是 0。
  // 「什么都没看到」跟「抓到了但问题多」必须分开说。
  if(rep.health_score==null){
    out.appendChild(el(`<div class="note warn"><b>一页都没抓到，所以给不出分数。</b><br>
      常见原因：站点屏蔽了自动化访问、需要 JS 渲染，或 robots.txt 不允许。<br>
      可以试试打开上面的「渲染 JavaScript」再扫一次。<br>
      <span style="color:var(--faint)">这不是「你的网站没问题」，只是我们什么都没看到。</span></div>`));
    return;
  }

  last=rep;
  const s=Math.round(rep.health_score);
  const g=s>=90?'g1':s>=70?'g2':s>=40?'g3':'g4';
  const verdict=s>=90?'状态不错':s>=70?'有一些要改':s>=40?'问题不少':'亟需处理';

  out.appendChild(el(`<div class="headline">
    <div class="hl-top">
      <span class="hl-score ${g}">${s}</span>
      <span class="hl-verdict">${verdict}</span>
      <span class="hl-meta">${esc(rep.domain)} · ${rep.pages_crawled} 页 ·
        ${rep.pages_discovered} URL · ${rep.duration_seconds}s</span>
    </div>
    <div class="meter"><i class="${g}" style="width:${Math.max(0,Math.min(100,s))}%"></i></div>
    <div class="dims">
      ${Object.entries(rep.score_breakdown?.dimension_scores||{}).map(([k,v])=>`
        <div class="dim"><label>${esc(DIM_CN[k]||k)}</label>
          <div class="t"><i style="width:${Math.max(0,Math.min(100,v))}%"></i></div>
          <em>${Math.round(v)}</em></div>`).join('')}
    </div>
  </div>`));

  const counts=rep.score_breakdown?.severity_counts||{};
  const total=rep.issue_count||0;
  if(!total){
    out.appendChild(el(`<div class="note ok"><b>这次没查出问题。</b><br>
      <span style="color:var(--muted)">但这不等于你的网站一定没问题——只覆盖了这次抓到的
      ${rep.pages_crawled} 个页面，而且只跑了当前选中的市场那套规则。</span></div>`));
    return;
  }

  const f=el(`<div class="filters">
    <span class="lb">筛选</span>
    <button class="f on" data-f="all">全部 <b>${total}</b></button>
    ${SEV.filter(k=>counts[k]).map(k=>
      `<button class="f" data-f="${k}">${SEV_CN[k]} <b>${counts[k]}</b></button>`).join('')}
  </div>`);
  f.querySelectorAll('.f').forEach(btn=>btn.addEventListener('click',()=>{
    filter=btn.dataset.f;
    f.querySelectorAll('.f').forEach(x=>x.classList.remove('on'));
    btn.classList.add('on');paint();
  }));
  out.appendChild(f);
  out.appendChild(el('<div id="list"></div>'));
  paint();
}

function paint(){
  const box=$('list');
  if(!box||!last)return;
  const all=(last.issues||[]).slice()
    .sort((a,b)=>SEV.indexOf(a.severity)-SEV.indexOf(b.severity));
  const shown=filter==='all'?all:all.filter(i=>i.severity===filter);
  box.innerHTML='';
  if(!shown.length){box.appendChild(el('<div class="note">这个级别没有问题。</div>'));return;}
  shown.forEach(i=>box.appendChild(card(i)));
  box.appendChild(el(`<div style="color:var(--faint);font-size:12px;text-align:center;
    margin-top:16px">共 ${shown.length} 条 · 每条都可在报告里追到原文证据</div>`));
}

function card(i){
  return el(`<details class="issue">
    <summary>
      <span class="sev ${esc(i.severity)}">${esc(SEV_CN[i.severity]||i.severity)}</span>
      <span class="ttl">${esc(i.title)}</span>
      <span class="cnt">${i.affected_pages>1?i.affected_pages+' 页':''}</span>
      <span class="caret">▶</span>
    </summary>
    <div class="body">
      ${i.description?`<p>${esc(i.description)}</p>`:''}
      ${i.fix_hint?`<div class="blabel">怎么改</div><div class="fix">${esc(i.fix_hint)}</div>`:''}
      ${i.fix_example?`<div class="blabel" style="margin-top:12px">示例</div>
        <div class="fix"><pre>${esc(i.fix_example)}</pre></div>`:''}
      ${i.url?`<div class="blabel" style="margin-top:12px">出问题的页面</div>
        <div class="url">${esc(i.url)}</div>`:''}
      <div class="blabel" style="margin-top:12px">规则</div>
      <span class="code">${esc(i.code)}</span>
    </div>
  </details>`);
}
</script>
</body>
</html>
