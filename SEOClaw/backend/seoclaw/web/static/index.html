<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEOClaw</title>
<!--
  ⚠️ 零外部依赖：无 Web Font、无 CDN、无外部 CSS/JS。
  理由：这套系统要能私有化部署、离线可用，而 webfont 是 CDN 请求第一名。
  代价是没有品牌字体 —— 补偿手段在 DESIGN.md：数字与代码全部等宽 +
  tabular-nums，层级靠字重/字距/留白建立，不靠装饰。
  所有接口路径照 backend 的 OpenAPI 契约，不凭印象。
-->
<style>
:root{
  --bg:oklch(0.145 0.006 265); --bg-raised:oklch(0.185 0.007 265);
  --bg-sunken:oklch(0.115 0.005 265);
  --fg:oklch(0.93 0.006 265); --fg-muted:oklch(0.62 0.010 265);
  --fg-faint:oklch(0.45 0.008 265);
  --border:oklch(0.28 0.008 265); --border-strong:oklch(0.36 0.010 265);
  --accent:oklch(0.86 0.19 128); --accent-dim:oklch(0.55 0.12 128);
  --critical:oklch(0.62 0.22 25); --high:oklch(0.72 0.17 55);
  --medium:oklch(0.78 0.15 85); --low:oklch(0.65 0.10 240);
  --r-ctl:3px; --r-panel:6px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  --sp:4px;
  --t-fast:120ms; --t-base:200ms;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:400 14px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── 布局：左栏固定 + 主区 ───────────────────────────── */
.app{display:grid;grid-template-columns:264px 1fr;height:100vh}
.side{
  background:var(--bg-sunken);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.brand{padding:16px 16px 12px;border-bottom:1px solid var(--border)}
.brand b{font-size:15px;font-weight:700;letter-spacing:-0.02em}
.brand small{display:block;color:var(--fg-faint);font:400 11px/1.4 var(--mono);margin-top:2px}
.side-scroll{flex:1;overflow-y:auto;padding:8px}
.side-h{
  font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--fg-faint);padding:12px 8px 6px;
}
.site-item{
  display:block;width:100%;text-align:left;background:none;border:0;
  padding:8px 10px;border-radius:var(--r-ctl);cursor:pointer;
  transition:background var(--t-fast) ease-out;
}
.site-item:hover{background:var(--bg-raised)}
.site-item[aria-current="true"]{background:var(--bg-raised);box-shadow:inset 2px 0 0 var(--accent)}
.site-item .d{font:500 13px/1.35 var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-item .m{font:400 11px/1.3 var(--mono);color:var(--fg-faint);margin-top:1px}
.side-foot{padding:8px;border-top:1px solid var(--border)}

/* ── 主区 ────────────────────────────────────────────── */
.main{overflow-y:auto;display:flex;flex-direction:column}
.top{
  padding:20px 28px 0;border-bottom:1px solid var(--border);
  display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;
}
.top h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-0.028em;font-family:var(--mono)}
.top .sub{color:var(--fg-muted);font:400 12px/1.5 var(--mono);margin-top:4px}
.spacer{flex:1}

/* 健康分环 */
.ring{--v:0;width:76px;height:76px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--border);stroke-width:6}
.ring .vl{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;
  transition:stroke-dashoffset 600ms cubic-bezier(.2,.8,.3,1)}
.ring .num{
  position:absolute;inset:0;display:grid;place-items:center;
  font:600 20px/1 var(--mono);letter-spacing:-0.03em;
}
.ring .num small{font-size:10px;font-weight:400;color:var(--fg-faint)}

/* ── 按钮：按重要性排序，不按语义配色 ─────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;
  background:var(--bg-raised);border:1px solid var(--border-strong);
  border-radius:var(--r-ctl);cursor:pointer;font-size:13px;font-weight:500;
  transition:background var(--t-fast) ease-out,border-color var(--t-fast) ease-out;
}
.btn:hover{background:oklch(0.22 0.008 265);border-color:var(--fg-faint)}
.btn:active{transform:translateY(0.5px)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn:disabled:hover{background:var(--bg-raised);border-color:var(--border-strong)}
.btn-p{background:var(--accent);border-color:var(--accent);color:oklch(0.20 0.06 128);font-weight:600}
.btn-p:hover{background:oklch(0.92 0.19 128);border-color:oklch(0.92 0.19 128)}
.btn-sm{min-height:26px;padding:0 8px;font-size:12px}
.btn-g{background:none;border-color:transparent}
.btn-g:hover{background:var(--bg-raised);border-color:var(--border)}

/* ── 表单：真 label，不是 placeholder ─────────────────── */
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld label{font:600 11px/1 var(--mono);letter-spacing:.04em;color:var(--fg-muted)}
.fld .hint{font:400 11px/1.45 var(--sans);color:var(--fg-faint)}
.fld input[type=text],.fld input[type=number],.fld select{
  height:32px;padding:0 9px;background:var(--bg-sunken);
  border:1px solid var(--border);border-radius:var(--r-ctl);
  transition:border-color var(--t-fast) ease-out;
}
.fld input:focus,.fld select:focus{border-color:var(--accent);outline:none}
.fld input[aria-invalid="true"]{border-color:var(--critical)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}

/* ── 卡片 / 面板 ─────────────────────────────────────── */
.panel{background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--r-panel);margin:0 28px 20px}
.panel-h{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.panel-h h2{margin:0;font-size:13px;font-weight:600;letter-spacing:-0.01em}
.panel-h .n{font:400 11px/1 var(--mono);color:var(--fg-faint)}
.panel-b{padding:16px}

/* 签名动作：最该先做的三件事 */
.prio{display:flex;flex-direction:column;gap:8px}
.prio-i{
  display:flex;gap:12px;align-items:flex-start;padding:10px 12px;
  background:var(--bg-sunken);border:1px solid var(--border);
  border-left-width:3px;border-radius:var(--r-ctl);
}
.prio-i .num{font:600 12px/1.4 var(--mono);color:var(--fg-faint);flex:none;width:18px}
.prio-i .bd{flex:1;min-width:0}
.prio-i .t{font-size:13px;font-weight:500}
.prio-i .u{font:400 11px/1.5 var(--mono);color:var(--fg-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}

/* ── 严重度：颜色 + 文字标签，绝不只靠颜色 ─────────────── */
.sev{display:inline-flex;align-items:center;gap:5px;font:600 10px/1 var(--mono);
  letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:2px;
  border:1px solid currentColor;flex:none}
.sev::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.sev-critical{color:var(--critical)} .sev-high{color:var(--high)}
.sev-medium{color:var(--medium)} .sev-low{color:var(--low)}
.sev-info{color:var(--fg-faint)}

.tag{display:inline-block;font:500 11px/1 var(--mono);color:var(--fg-muted);
  background:var(--bg-sunken);border:1px solid var(--border);
  padding:3px 6px;border-radius:2px}

/* ── 表格：文本左对齐，数字右对齐 + tabular ─────────────── */
table{width:100%;border-collapse:collapse}
th{
  text-align:left;font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--fg-faint);padding:8px 10px;border-bottom:1px solid var(--border);
}
td{padding:9px 10px;border-bottom:1px solid oklch(0.22 0.007 265);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:oklch(0.20 0.007 265)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── 空 / 加载 / 错：三者各有版式 ─────────────────────── */
.empty{padding:32px 20px;text-align:center}
.empty .t{font-size:14px;font-weight:600;margin-bottom:6px}
.empty .d{font-size:13px;color:var(--fg-muted);max-width:44ch;margin:0 auto;line-height:1.6}
.empty .a{margin-top:14px}
.err{padding:12px 14px;background:oklch(0.22 0.045 25);border:1px solid var(--critical);
  border-radius:var(--r-ctl);margin-bottom:12px}
.err .t{font-weight:600;font-size:13px;margin-bottom:3px}
.err .d{font:400 12px/1.55 var(--mono);color:var(--fg-muted);word-break:break-word}
.err .n{font-size:12px;color:var(--fg-muted);margin-top:6px}
.skel{background:linear-gradient(90deg,var(--bg-raised) 25%,oklch(0.22 0.008 265) 50%,var(--bg-raised) 75%);
  background-size:200% 100%;animation:sk 1.3s infinite;border-radius:2px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── 页签 ───────────────────────────────────────────── */
.tabs{display:flex;gap:2px;padding:0 28px;border-bottom:1px solid var(--border);
  overflow-x:auto;background:var(--bg);position:sticky;top:0;z-index:5}
.tab{
  padding:9px 13px;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--fg-muted);cursor:pointer;font-size:13px;white-space:nowrap;
  transition:color var(--t-fast) ease-out,border-color var(--t-fast) ease-out;
}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tab .badge{margin-left:5px;font:600 10px/1 var(--mono);color:var(--fg-faint)}

/* 统计条 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;
  background:var(--border);border:1px solid var(--border);border-radius:var(--r-panel);overflow:hidden}
.stat{background:var(--bg-raised);padding:12px 14px}
.stat .k{font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-faint)}
.stat .v{font:600 20px/1.2 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-0.03em;margin-top:6px}
.stat .x{font:400 11px/1.4 var(--mono);color:var(--fg-faint);margin-top:2px}

/* 迷你趋势 */
.spark{width:100%;height:56px;display:block}
.spark .ln{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linejoin:round}
.spark .ar{fill:oklch(0.145 0.006 265);stroke:var(--accent);stroke-width:1.5}
.spark .gl{stroke:oklch(0.24 0.007 265);stroke-width:1}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.kv dt{font:500 11px/1.5 var(--mono);color:var(--fg-faint);white-space:nowrap}
.kv dd{margin:0;line-height:1.5}
details{border-top:1px solid var(--border);padding:9px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--fg-faint);font-size:10px;transition:transform var(--t-fast) ease-out}
details[open] summary::before{transform:rotate(90deg)}
code{font:400 12px/1.5 var(--mono);background:var(--bg-sunken);
  padding:1px 5px;border-radius:2px;border:1px solid var(--border)}
.toolbar{padding:0 28px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <!-- ══ 左栏：站点 ══ -->
  <aside class="side">
    <div class="brand"><b>SEOClaw</b><small id="brandSub">—</small></div>
    <div class="side-scroll">
      <div class="side-h">站点</div>
      <div id="siteList"></div>
    </div>
    <div class="side-foot" style="display:flex;gap:6px">
      <button class="btn" id="btnAdd" style="flex:1;justify-content:center">+ 接入站点</button>
      <button class="btn btn-g" id="btnKey" title="访问钥匙" style="flex:none">🔑</button>
    </div>
  </aside>

  <!-- ══ 主区 ══ -->
  <main class="main" id="main"></main>
</div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════
   API 层 —— 全部照 backend OpenAPI 契约，不凭印象
   ══════════════════════════════════════════════════════════ */
/* 钥匙存在 localStorage。⚠️ 明文钥匙只在浏览器里存在，服务端只存哈希，
   所以**丢了只能重新签发**——这页会明确告诉用户，别让人以为能找回。*/
const KEY_STORE = "seoclaw.api_key";
const apiKey = () => { try { return localStorage.getItem(KEY_STORE) || ""; } catch { return ""; } };
function setApiKey(v) {
  try { v ? localStorage.setItem(KEY_STORE, v) : localStorage.removeItem(KEY_STORE); } catch {}
}

const API = {
  async req(method, path, body) {
    const k = apiKey();
    const opt = { method, headers: k ? {"X-API-Key": k} : {} };
    if (body !== undefined) {
      opt.headers["Content-Type"] = "application/json";
      opt.body = JSON.stringify(body);
    }
    const res = await fetch(path, opt);
    const txt = await res.text();
    let data = null;
    try { data = txt ? JSON.parse(txt) : null; } catch { data = null; }
    if (!res.ok) {
      // 错误必须说清「是什么、为什么、下一步」——不许只抛一句红色
      const detail = (data && (data.detail || data.reason)) ||
                     (typeof data === "string" && data) ||
                     `HTTP ${res.status}`;
      const e = new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
      e.status = res.status; e.data = data;
      throw e;
    }
    return data;
  },
  get:  (p)     => API.req("GET", p),
  post: (p,b)   => API.req("POST", p, b ?? {}),
  patch:(p,b)   => API.req("PATCH", p, b),
  sites:        ()     => API.get("/api/v1/sites"),
  createSite:   (b)    => API.post("/api/v1/sites", b),
  site:         (id)   => API.get(`/api/v1/sites/${id}`),
  scan:         (id,b) => API.post(`/api/v1/sites/${id}/scan`, b),
  jobs:         (id)   => API.get(`/api/v1/sites/${id}/jobs`),
  report:       (id)   => API.get(`/api/v1/sites/${id}/report`),
  trend:        (id)   => API.get(`/api/v1/sites/${id}/trend`),
  issues:       (id,q) => API.get(`/api/v1/sites/${id}/issues` + (q||"")),
  setIssue:     (id,iid,st) => API.patch(`/api/v1/sites/${id}/issues/${iid}`, {status:st}),
  bulkIssue:    (id,fp,st)  => API.patch(`/api/v1/sites/${id}/issues`, {fingerprint:fp,status:st}),
  keywords:     (id)   => API.get(`/api/v1/sites/${id}/keywords?limit=200`),
  expandKw:     (id,b) => API.post(`/api/v1/sites/${id}/keywords/expand`, b),
  brief:        (id,b) => API.post(`/api/v1/sites/${id}/brief`, b),
  aiSummary:    (id)   => API.get(`/api/v1/sites/${id}/report/summary`),
  rankDrops:    (id,b) => API.post(`/api/v1/sites/${id}/rank-drops`, b),
  ackDrops:     (id,keys) => API.post(`/api/v1/sites/${id}/rank-drops/ack`, {alert_keys:keys}),
  usage:        (id)   => API.get(`/api/v1/sites/${id}/usage`),
  deleteSite:   (id)   => API.req("DELETE", `/api/v1/sites/${id}`),
  verification: (id)   => API.get(`/api/v1/sites/${id}/verification`),
  startVerification: (id) => API.post(`/api/v1/sites/${id}/verification`),
  listKeys:      ()     => API.get("/api/v1/keys"),
  createKey:     ()     => API.post("/api/v1/keys"),
  revokeKey:     (kid)  => API.post(`/api/v1/keys/${kid}/revoke`),
  checkVerification: (id, method) =>
                    API.post(`/api/v1/sites/${id}/verification/check?method=${method}`),
  me:           ()     => API.get("/api/v1/me"),
};

/* ══════════════════════════════════════════════════════════
   工具
   ══════════════════════════════════════════════════════════ */
const $  = (s,r=document) => r.querySelector(s);
const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) {
    if (c === null || c === undefined || c === false) continue;
    n.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return n;
};
const SEV = ["critical","high","medium","low","info"];
const SEV_LABEL = {critical:"严重",high:"高",medium:"中",low:"低",info:"提示"};
const sevTag = (s) => el("span",{class:`sev sev-${s}`,title:SEV_LABEL[s]||s}, SEV_LABEL[s]||s);

/* null 与 0 必须分开显示：0 分是「抓到了但全是问题」，
   null 是「一页都没抓到」—— 两者都显示成 0 会让用户误判该做什么。*/
const num = (v) => (v === null || v === undefined) ? "—" : v;
const fmtTime = (iso) => {
  if (!iso) return "—";
  const d = new Date(iso);
  return isNaN(d) ? "—" : d.toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ══════════════════════════════════════════════════════════
   状态
   ══════════════════════════════════════════════════════════ */
const S = { sites: [], siteId: null, tab: "overview", busy: new Map(), note: null };

function toast(msg, kind="info") {
  const t = el("div", {class:"err", style: kind==="info"
      ? "background:var(--bg-raised);border-color:var(--border)"
      : ""},
    el("div",{class:"t"}, msg));
  const host = $("#main");
  host.prepend(t);
  setTimeout(() => t.remove(), 4200);
}
async function withBusy(key, fn) {
  if (S.busy.has(key)) return;
  S.busy.set(key, true); render();
  try { return await fn(); }
  catch (e) { toast(e.message || String(e), "error"); throw e; }
  finally { S.busy.delete(key); render(); }
}

/* ══════════════════════════════════════════════════════════
   组件
   ══════════════════════════════════════════════════════════ */
function ring(score) {
  // null 时画空环并显示「—」：没抓到页不是 0 分
  const v = (score === null || score === undefined) ? 0 : Math.max(0, Math.min(100, score));
  const C = 2 * Math.PI * 32;
  return el("div", {class:"ring", title: score === null || score === undefined
      ? "没有可评分的数据：一页都没抓到" : `健康分 ${v}`},
    el("div",{html:`
      <svg width="76" height="76" viewBox="0 0 76 76" aria-hidden="true">
        <circle class="tr" cx="38" cy="38" r="32"/>
        <circle class="vl" cx="38" cy="38" r="32"
          stroke-dasharray="${C}" stroke-dashoffset="${C*(1-v/100)}"/>
      </svg>`}),
    el("div",{class:"num"},
      score === null || score === undefined
        ? el("span",{style:"color:var(--fg-faint)",html:"—"})
        : [el("span",{},String(Math.round(v))), el("small",{}, "/100")]));
}

function sparkline(points) {
  const pts = (points||[]).filter(p => p && p.score !== null && p.score !== undefined);
  if (pts.length < 2) {
    return el("div",{class:"empty",style:"padding:20px"},
      el("div",{class:"d"},"至少需要两轮有分数的扫描才能画出趋势。"));
  }
  const W=520,H=56,P=4;
  const xs = i => P + i*(W-2*P)/(pts.length-1);
  const ys = s => H-P - (Math.max(0,Math.min(100,s))/100)*(H-2*P);
  const d = pts.map((p,i)=>`${i?"L":"M"}${xs(i).toFixed(1)},${ys(p.score).toFixed(1)}`).join("");
  const last = pts[pts.length-1];
  return el("div",{class:"spark"}, el("div",{html:`
    <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
         role="img" aria-label="健康分趋势，最近 ${pts.length} 轮，从 ${Math.round(pts[0].score)} 到 ${Math.round(last.score)}">
      <line class="gl" x1="0" y1="${ys(0)}" x2="${W}" y2="${ys(0)}"/>
      <line class="gl" x1="0" y1="${ys(100)}" x2="${W}" y2="${ys(100)}"/>
      <path class="ln" d="${d}"/>
      <circle class="ar" cx="${xs(pts.length-1).toFixed(1)}" cy="${ys(last.score).toFixed(1)}" r="3"/>
    </svg>`}));
}

function errBox(e, hint) {

/* ══════════════════════════════════════════════════════════
   左栏
   ══════════════════════════════════════════════════════════ */
function renderSide() {
  const host = $("#siteList");
  host.textContent = "";
  if (!S.sites.length) {
    host.append(el("div",{style:"padding:10px 8px;font-size:12px;color:var(--fg-faint);line-height:1.6"},
      "还没接入任何站点。点下面「接入站点」，填一个域名就能扫。"));
    return;
  }
  for (const s of S.sites) {
    host.append(el("button", {
      class:"site-item", "aria-current": String(s.id === S.siteId),
      onclick: () => { S.siteId = s.id; S.tab = "overview"; render(); },
    },
      el("div",{class:"d"}, s.domain),
      el("div",{class:"m"}, (s.markets||[]).join(" · ") || "未指定市场")));
  }
}

/* ══════════════════════════════════════════════════════════
   主区
   ══════════════════════════════════════════════════════════ */
function render() {
  renderSide();
  const main = $("#main");
  main.textContent = "";
  if (!S.sites.length) { main.append(welcomeView()); return; }
  if (S.siteId === null) { main.append(pickSiteView()); return; }
  const site = S.sites.find(s => s.id === S.siteId);
  main.append(siteHeader(site), tabBar(site));
  const body = el("div",{style:"padding-top:20px"});
  main.append(body);
  ({ overview: viewOverview, issues: viewIssues, trend: viewTrend,
     keywords: viewKeywords, brief: viewBrief, ranks: viewRanks,
     usage: viewUsage, verify: viewVerify
   }[S.tab] || viewOverview)(body, site);
}

  return el("div",{style:"flex:1;display:grid;place-items:center;padding:40px"},

/* ── 概览 ─────────────────────────────────────────────── */
async function viewOverview(host, site) {
  host.append(el("div",{class:"skel",style:"height:96px;margin:0 28px 20px"}));
  let rep, trend;
  try {
    rep = await API.report(site.id);
    trend = await API.trend(site.id).catch(() => null);
  } catch (e) {
    host.textContent = "";
    host.append(el("div",{class:"panel"},
      el("div",{class:"panel-b"}, errBox(e, "如果刚启动服务，确认它已加载最新代码：GET /api/v1/health 的 stale 字段。"))));
    return;
  }
  host.textContent = "";
  if (S.busy.has(`scan:${site.id}`)) { host.append(el("div",{class:"skel",style:"height:200px;margin:0 28px 20px"})); return; }

  const counts = rep.counts || {};
  const total = SEV.reduce((a,k)=>a+((counts[k]||0)),0);

  if (rep.pages_crawled === 0) {
    host.append(el("div",{class:"panel"}, el("div",{class:"panel-b"},
      emptyBox("这个站还没扫过", "先跑一次体检，才会有健康分和问题清单。扫一次通常 1～2 分钟，1000 页的站约 5.6 分钟。",
        el("button",{class:"btn btn-p",onclick:()=>openScan(site)},"开始体检")))));
    return;
  }

  /* ── 签名动作：最该先做的三件事 ── */
  const issues = rep.issues || [];
  const rank = {critical:0,high:1,medium:2,low:3,info:4};
  const sorted = issues.slice().sort((a,b)=>
    (rank[a.severity]??9)-(rank[b.severity]??9) || (b.occurrences||1)-(a.occurrences||1));
  const prio = sorted.slice(0,3);

  const prioPanel = el("div",{class:"panel"},
    el("div",{class:"panel-h"},
      el("h2",{},"最该先做的三件事"),
      el("span",{class:"n"},`共 ${total} 条问题`)),
    el("div",{class:"panel-b"},
      prio.length
        ? el("div",{class:"prio"}, prio.map((it,i)=>
            el("div",{class:"prio-i", style:`border-left-color:var(--${it.severity==="info"?"fg-faint":it.severity})`},
              el("div",{class:"num"}, String(i+1)),
              el("div",{class:"bd"},
                el("div",{class:"t"}, it.title),
                el("div",{class:"u"}, it.url || it.code),
                el("div",{style:"margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"},
                  sevTag(it.severity),
                  el("button",{class:"btn btn-sm",onclick:()=>markIssue(site,it)},"标为已修"),
                  el("button",{class:"btn btn-sm btn-g",onclick:()=>{S.tab="issues";render();}},"看全部"))))))
        : emptyBox("没有待处理的问题","这轮扫描没发现问题。保持定期体检，才能发现回退。")));
  host.append(prioPanel);

  /* ── 分数 + 统计 ── */
  const stat = (k,v,x) => el("div",{class:"stat"},el("div",{class:"k"},k),
    el("div",{class:"v"},v), x?el("div",{class:"x"},x):null);
  host.append(el("div",{style:"display:flex;gap:20px;align-items:center;padding:0 28px 20px;flex-wrap:wrap"},
    ring(rep.health_score),
    el("div",{style:"display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;              background:var(--border);border:1px solid var(--border);border-radius:var(--r-panel);overflow:hidden;flex:1;min-width:280px"},
      stat("已抓页面", String(rep.pages_crawled)),
      stat("严重", String(counts.critical||0)),
      stat("高", String(counts.high||0)),
      stat("中", String(counts.medium||0)),
      stat("低", String(counts.low||0)))));

  /* ── 趋势 ── */
  host.append(el("div",{class:"panel"},
    el("div",{class:"panel-h"},
      el("h2",{},"健康分趋势"),
      el("span",{class:"n"}, trend ? `${(trend.points||[]).length} 轮` : "")),
    el("div",{class:"panel-b"}, trend && (trend.points||[]).length
      ? sparkline(trend.points)
      : emptyBox("还没有趋势数据","趋势需要至少两轮扫描。当前只有一轮，等下次体检后再看。"))));

  /* ── AI 总结（收费功能）── */
  host.append(el("div",{class:"panel"},
    el("div",{class:"panel-h"}, el("h2",{},"AI 总结"),
      el("span",{class:"n"},"需配置模型 API")),
    el("div",{class:"panel-b"}, el("div",{id:"aiBox"},
      el("button",{class:"btn btn-sm",onclick:()=>loadAi(site)},"生成总结")))));
}

async function loadAi(site) {
  const box = $("#aiBox"); if (!box) return;
  box.textContent = "生成中…";
  try {
    const r = await API.aiSummary(site.id);
    box.textContent = "";
    if (r.summary) box.append(el("p",{style:"margin:0;line-height:1.7"}, r.summary));
    else box.append(el("div",{},
      el("div",{style:"color:var(--fg-muted);font-size:13px;line-height:1.6"},
        r.reason || "没生成出来。"),
      el("div",{style:"color:var(--fg-faint);font-size:12px;margin-top:6px"},
        "这是需要模型 API 的功能，配上 key 即可用；不影响其余功能。")));
  } catch (e) { box.textContent = ""; box.append(errBox(e)); }
}

/* ── 问题 ─────────────────────────────────────────────── */
async function viewIssues(host, site) {
  const wrap = el("div");
  host.append(wrap);
  const filter = {severity:"", limit:100};
  async function load() {
    wrap.textContent = "";
    const q = new URLSearchParams();
    if (filter.severity) q.set("severity", filter.severity);
    q.set("limit", String(filter.limit));
    let items;
    try { items = await API.issues(site.id, "?" + q.toString()); }
    catch (e) { wrap.append(errBox(e)); return; }

    const bar = el("div",{class:"toolbar"});
    const sel = el("select",{style:"height:30px;padding:0 8px;background:var(--bg-sunken);border:1px solid var(--border);border-radius:var(--r-ctl)",
      onchange:(e)=>{filter.severity=e.target.value;load();}});
    sel.append(el("option",{value:""},"全部严重度"));
    for (const s of SEV) sel.append(el("option",{value:s},SEV_LABEL[s]));
    sel.value = filter.severity;
    bar.append(sel, el("span",{class:"tag"},`${items.length} 条`));
    wrap.append(bar);

    if (!items.length) {
      wrap.append(el("div",{class:"panel"}, el("div",{class:"panel-b"},
        emptyBox("这里没有问题", filter.severity ? "换个严重度看看。" : "这轮扫描没发现问题。"))));
      return;
    }

    const rows = items.map(it => {
      const tr = el("tr",{},
        el("td",{}, it.severity ? sevTag(it.severity) : "—"),
        el("td",{}, el("div",{style:"font-weight:500"}, it.title),
          el("div",{style:"font:400 11px/1.5 var(--mono);color:var(--fg-faint);margin-top:2px"}, it.url || it.code)),
        el("td",{class:"num"}, String(it.occurrences || 1)),
        el("td",{}, it.status === "open"
          ? el("button",{class:"btn btn-sm",onclick:()=>markIssue(site,it)},"标为已修")
          : el("span",{class:"tag"}, it.status)));
      return tr;
    });
    wrap.append(el("div",{class:"panel"},
      el("table",{},
        el("thead",{}, el("tr",{},
          el("th",{},"严重度"), el("th",{},"问题"),
          el("th",{class:"num"},"页数"), el("th",{},"操作"))),
        el("tbody",{}, rows))));
  }
  await load();
}

/* ── 关键词 ───────────────────────────────────────────── */
async function viewKeywords(host, site) {
  const wrap = el("div"); host.append(wrap);
  async function load() {
    wrap.textContent = "";

    const seed = el("input",{type:"text",placeholder:"rust 所有权, async trait",
      style:"height:30px;padding:0 9px;min-width:220px;background:var(--bg-sunken);border:1px solid var(--border);border-radius:var(--r-ctl)"});
    tools.append(el("label",{style:"font:600 11px/1 var(--mono);color:var(--fg-muted)"},"种子词"),
      seed,
      el("button",{class:"btn",onclick:async()=>{
        const seeds = seed.value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
        if (!seeds.length) { toast("至少给一个种子词——没有种子的共现等于把全站词两两配对，噪声大于信号","error"); return; }
        try { const r = await API.expandKw(site.id,{seeds});
          toast(r.status==="ok" ? `扩展出 ${r.candidates} 个候选词，分成 ${r.clusters} 簇`
                                : `没扩展：${r.reason}`);
          load();
        } catch(e){ toast(e.message||String(e),"error"); }
      }},"扩展 + 聚类"),
      el("span",{class:"spacer"}),
      el("button",{class:"btn btn-g btn-sm",onclick:load},"刷新"));

    let data;

    const items = data.items || [];
    if (!items.length) {
      wrap.append(el("div",{class:"panel"}, el("div",{class:"panel-b"},
        emptyBox("还没有关键词","关键词来自已抓页面的语料与共现统计。先跑一次体检，再填种子词扩展。"))));
      return;
    }
    const head = el("tr", {},
      el("th", {}, "词"), el("th", {}, "意图"),
      el("th", {class:"num"}, "簇"),
      el("th", {class:"num"}, "分数"),
      el("th", {}, "来源"));
    const rows = items.map(k => el("tr", {},
      el("td", {style:"font:500 13px/1.4 var(--mono)"}, k.term),
      el("td", {}, k.intent ? el("span", {class:"tag"}, k.intent) : "—"),
      el("td", {class:"num"}, num(k.cluster_id)),
      el("td", {class:"num"}, num(k.score)),
      el("td", {style:"font:400 12px/1.4 var(--mono);color:var(--fg-faint)"}, k.source || "—")));
    wrap.append(el("div", {class:"panel"},

}

/* ── 内容 Brief ───────────────────────────────────────── */
async function viewBrief(host, site) {
  const wrap = el("div"); host.append(wrap);
  const kw = el("input",{type:"text",placeholder:"要写的关键词"});
  const url = el("input",{type:"text",placeholder:"https://example.com/target-page"});
  const btn = el("button",{class:"btn btn-p"},"生成 Brief");
  wrap.append(el("div",{class:"panel"},
    el("div",{class:"panel-h"}, el("h2",{},"内容 Brief"),
      el("span",{class:"n"},"纯规则计算，不需要模型 API")),
    el("div",{class:"panel-b"},
      el("div",{class:"row"},
        el("div",{class:"fld"},el("label",{},"关键词"),kw),
        el("div",{class:"fld"},el("label",{},"目标 URL"),url)),
      btn, el("div",{id:"briefOut",style:"margin-top:16px"}))));

  btn.addEventListener("click", async () => {
    const out = $("#briefOut");
    if (!kw.value.trim() || !url.value.trim()) {
      out.textContent = ""; out.append(errBox({message:"关键词和目标 URL 都要填"},"两者都是必需的：Brief 是「这个词 + 这篇页面」的组合。"));
      return;
    }
    btn.disabled = true; out.textContent = "生成中…";
    try {
      const b = await API.brief(site.id,{keyword:kw.value.trim(),target_url:url.value.trim()});
      out.textContent = ""; out.append(briefView(b));
    } catch(e){ out.textContent=""; out.append(errBox(e)); }
    finally { btn.disabled = false; }
  });
}

function briefView(b) {
  const wrap = el("div");
  if (b.caveats && b.caveats.length) {
    wrap.append(el("div",{class:"err",style:"background:var(--bg-raised);border-color:var(--medium)"},
      el("div",{class:"t"},"这份 Brief 的依据不完整"),
      ...b.caveats.map(c=>el("div",{class:"n",style:"margin-top:4px"}, c))));
  }
  const dl = el("dl",{class:"kv",style:"margin-top:14px"});
  dl.append(el("dt",{},"页面类型"), el("dd",{}, b.page_type || "—"));
  if (b.title_candidates && b.title_candidates.length) {
    dl.append(el("dt",{},"标题候选"),
      el("dd",{}, el("ul",{style:"margin:0;padding-left:18px"},
        b.title_candidates.map(t=>el("li",{},t)))));
  }
  const ob = b.own_length_baseline || {};
  if (Object.keys(ob).length) {
    dl.append(el("dt",{},"本站字数基线"),
      el("dd",{style:"font-family:var(--mono);font-size:12px"},

  }
  wrap.append(el("div",{class:"panel"}, el("div",{class:"panel-b"}, dl)));
  if (b.opportunities && b.opportunities.length) {
    wrap.append(el("div",{class:"panel"},
      el("div",{class:"panel-h"}, el("h2",{},"可做的差异化机会"), el("span",{class:"n"},`${b.opportunities.length} 条`)),
      el("div",{class:"panel-b"}, el("div",{class:"prio"},
        b.opportunities.map((o,i)=>el("div",{class:"prio-i",style:"border-left-color:var(--accent)"},
          el("div",{class:"num"},String(i+1)),
          el("div",{class:"bd"},
            el("div",{class:"t"}, o.title || o.code || "机会"),
            el("div",{class:"u"}, o.detail || o.why || ""))))))));
  }
  if (b.not_available && b.not_available.length) {
    wrap.append(el("div",{class:"panel"},
      el("div",{class:"panel-h"}, el("h2",{},"本次拿不到的数据")),
      el("div",{class:"panel-b"}, el("ul",{style:"margin:0;padding-left:18px;color:var(--fg-muted);font-size:13px;line-height:1.7"},
        b.not_available.map(x=>el("li",{},x))))));
  }
  return wrap;
}

/* ── 排名告警 ─────────────────────────────────────────── */
async function viewRanks(host, site) {
  const wrap = el("div"); host.append(wrap);
  async function load() {
    wrap.textContent = "";
    const cfg = {window_days:30,min_drop:5,min_impressions:10,min_days:4,only_new:true};
    const tools = el("div",{class:"toolbar"});
    const nd = el("input",{type:"number",value:"5",min:"0",step:"1",
      style:"height:30px;padding:0 8px;width:74px;background:var(--bg-sunken);border:1px solid var(--border);border-radius:var(--r-ctl)"});
    const ni = el("input",{type:"number",value:"10",min:"0",
      style:"height:30px;padding:0 8px;width:74px;background:var(--bg-sunken);border:1px solid var(--border);border-radius:var(--r-ctl)"});
    tools.append(
      el("label",{style:"font:600 11px/1 var(--mono);color:var(--fg-muted)"},"掉几名才算事"), nd,
      el("label",{style:"font:600 11px/1 var(--mono);color:var(--fg-muted);margin-left:8px"},"最低曝光"), ni,
      el("button",{class:"btn",style:"margin-left:8px",onclick:()=>{cfg.min_drop=+nd.value||5;cfg.min_impressions=+ni.value||0;load();}},"查"),
      el("span",{class:"spacer"}),
      el("span",{class:"tag"},"仅显示未标记「已看过」的"));
    wrap.append(tools);

    let alerts;
    try { alerts = await API.rankDrops(site.id, cfg); }
    catch (e) { wrap.append(errBox(e)); return; }

    if (!alerts.length) {
      wrap.append(el("div",{class:"panel"}, el("div",{class:"panel-b"},
        emptyBox("没有需要提醒的跌落",
          "要么排名没掉，要么掉得没超过你设的门槛。这是好结果——告警宁少勿多，吵多了就没人看了。"))));
      return;
    }
    const panel = el("div",{class:"panel"},
      el("div",{class:"panel-h"}, el("h2",{},"排名跌幅"), el("span",{class:"n"},`${alerts.length} 条`)),
      el("div",{class:"panel-b"}, el("div",{class:"prio"},
        alerts.map(a=>el("div",{class:"prio-i",style:"border-left-color:var(--high)"},
          el("div",{class:"num"},"↓"),
          el("div",{class:"bd"},
            el("div",{class:"t"}, a.message),
            el("div",{class:"u"}, `${a.from_date} → ${a.to_date}`),
            el("div",{style:"margin-top:8px"},
              el("button",{class:"btn btn-sm",onclick:async()=>{
                try { await API.ackDrops(site.id,[a.alert_key]); toast("已标记看过"); load(); }
                catch(e){ toast(e.message||String(e),"error"); }
              }},"标记已看过"))))))));
    wrap.append(panel);
  }
  await load();
}

/* ── 用量 ─────────────────────────────────────────────── */
async function viewUsage(host, site) {
  let u, me = null;
  try { u = await API.usage(site.id); } catch (e) { host.append(errBox(e)); return; }
  // ⚠️ 额度**从 /me 读，不在前端写死**。写死 2000 的后果是：改成 3000 时
  // 前端还显示 2000，而用户以为看到的是真账 —— 额度显示错了比不显示更糟。
  // 单机模式下 /me 返回 limit: null，含义是「不限量」，不是「额度是 0」。
  try { me = await API.me(); } catch { /* 拿不到就只展示口径 */ }

  const stat = (k, v, x) => el("div", {class:"stat"},
    el("div", {class:"k"}, k),
    el("div", {class:"v"}, v),
    x ? el("div", {class:"x"}, x) : null);

  const statsRow = el("div", {class:"stats"},
    stat("累计计量", String(u.total)),
    me && me.quota.limit !== null
      ? stat("本月已用", `${me.quota.used}/${me.quota.limit} 页`)
      : stat("本月已用", me ? `${me.quota.used} 页` : "—"));
  if (me && me.quota.limit === null) {
    statsRow.append(stat("计费状态", "单机模式，不限量"));
  }
  for (const [k, v] of Object.entries(u.by_kind || {})) {
    statsRow.append(stat(k, String(v)));
  }

  const note = el("div",
    {style:"margin-top:14px;color:var(--fg-muted);font-size:12px;line-height:1.7"},
    me && me.quota.enforced
      ? "成本与抓取的页数成正比，与「扫了几次」无关，所以额度按页算。用完会在提交扫描时直接拒绝 —— 按请求页数拦，不是等爬到一半才停。"
      : "当前是单机部署模式，不计量、不拦额度。配了访问钥匙并让服务端开鉴权后，按每月 2000 页计量。");

  const body = el("div", {class:"panel-b"}, statsRow, note);
  const head = el("div", {class:"panel-h"},
    el("h2", {}, "用量"),
    el("span", {class:"n"}, "免费额度按页算，不按次数"));
  host.append(el("div", {class:"panel"}, head, body));
}

/* ── 归属验证：这个站凭什么算你的 ─────────────────────────── */
async function viewVerify(host, site) {
  const wrap = el("div"); host.append(wrap);
  let v;
  try { v = await API.verification(site.id); }
  catch (e) { wrap.append(errBox(e)); return; }

  const done = v.status === "verified";

  if (done) {
    wrap.append(el("div", {class:"panel"},
      el("div", {class:"panel-h"}, el("h2", {}, "已验证")),
      el("div", {class:"panel-b"},
        el("p", {style:"margin:0 0 6px;font-size:13px;line-height:1.7"},
          "这个站点已证明归你所有，可以进监控和告警。"),
        el("dl", {class:"kv"},
          el("dt", {}, "验证方式"),
          el("dd", {}, v.verify_method === "dns" ? "DNS TXT" :
                      v.verify_method === "meta" ? "首页 meta 标签" : (v.verify_method || "—")),
          el("dt", {}, "验证时间"),
          el("dd", {style:"font-family:var(--mono);font-size:12px"},
            v.verified_at ? new Date(v.verified_at).toLocaleString("zh-CN") : "—")))));
    return;
  }

  const tokBox = v.token
    ? el("code", {style:"display:block;margin-top:6px;padding:8px 10px;font-size:13px;word-break:break-all"},
        v.token)
    : el("div", {style:"color:var(--fg-muted);font-size:13px;margin-top:6px"},
        "还没有生成 token。先点右边的「生成 token」。");

  const dnsBox = el("pre", {
    style:"margin:6px 0 0;padding:10px;background:var(--bg-sunken);border:1px solid var(--border);border-radius:var(--r-ctl);font:400 12px/1.6 var(--mono);white-space:pre-wrap",
  }, v.dns_instructions || "（先生成 token）");

  const metaBox = el("pre", {
    style:"margin:6px 0 0;padding:10px;background:var(--bg-sunken);border:1px solid var(--border);border-radius:var(--r-ctl);font:400 12px/1.6 var(--mono);white-space:pre-wrap",
  }, v.meta_instructions || "（先生成 token）");

  const out = el("div", {style:"margin-top:12px"});

  const checkBtn = (method, label) => el("button", {
    class:"btn", style:"margin-top:10px;margin-right:8px",
    onclick: async (e) => {
      const btn = e.target; btn.disabled = true; btn.textContent = "查询中…";
      try {
        const r = await API.checkVerification(site.id, method);
        out.textContent = "";
        if (r.status === "verified") {
          out.append(el("div", {class:"err", style:"background:var(--bg-raised);border-color:var(--accent)"},
            el("div", {class:"t"}, "验证通过"), el("div", {class:"d"}, "这个站点现在可以进监控和告警。")));
          render();
        } else {
          out.append(el("div", {class:"err"},
            el("div", {class:"t"}, "还没验证通过"),
            el("div", {class:"d"}, "确认记录已经加上，并且等它生效（DNS 通常几分钟）。")));
        }
      } catch (e2) {
        out.textContent = ""; out.append(errBox(e2));
      } finally { btn.disabled = false; btn.textContent = label; }
    },
  }, label);

  wrap.append(el("div", {class:"panel"},
    el("div", {class:"panel-h"},
      el("h2", {}, "站点归属验证"),
      el("span", {class:"n"}, "未验证"),
      el("div", {class:"spacer"}),
      el("button", {class:"btn btn-sm", onclick: async () => {
        try { await API.startVerification(site.id); render(); }
        catch (e) { toast(e.message || String(e), "error"); }
      }}, "生成 token")),
    el("div", {class:"panel-b"},
      el("p", {style:"margin:0 0 10px;color:var(--fg-muted);font-size:13px;line-height:1.7"},
        "这条通道存在，是因为「一把钥匙只能说明你是谁，说明不了这个站是你的」。",
        el("br"),
        "未验证的站点可以照常体检，但**不能进监控和告警** —— 告警要持续抓取，",
        "不验证就等于提供免费爬虫跳板。"),
      el("div", {style:"margin-top:12px"},
        el("div", {style:"font:600 11px/1 var(--mono);color:var(--fg-muted)"}, "TOKEN"),
        tokBox),
      el("div", {style:"margin-top:14px"},
        el("div", {style:"font:600 11px/1 var(--mono);color:var(--fg-muted)"}, "方式一：DNS TXT"),
        el("div", {style:"color:var(--fg-faint);font-size:12px;margin-top:3px"},
          "有 DNS 权限就用这个。最难伪造。"), dnsBox,
        checkBtn("dns", "检查 DNS")),
      el("div", {style:"margin-top:14px"},
        el("div", {style:"font:600 11px/1 var(--mono);color:var(--fg-muted)"}, "方式二：首页 meta"),
        el("div", {style:"color:var(--fg-faint);font-size:12px;margin-top:3px"},
          "WordPress 用户装个插件就行。"), metaBox,
        checkBtn("meta", "检查 meta")),
      out)));

  void tokBox;
}

/* ── 删除站点 ─────────────────────────────────────────── */
async function deleteSite(site) {
  // ⚠️ 删除连带清掉这个站的页面、问题、关键词、计量记录，不可逆。
  // 所以必须二次确认，且**把连带删掉的东西说出来** ——
  // 只问「确定吗」等于没问。
  const ok = window.confirm(
    `删除 ${site.domain}？\n\n` +
    `这会连带删除它的所有体检页面、问题记录、关键词和用量记录，**无法撤销**。\n\n` +
    `确定要删吗？`
  );
  if (!ok) return;
  try {
    await API.deleteSite(site.id);
    S.siteId = null;
    S.sites = await API.sites().catch(() => S.sites.filter(x => x.id !== site.id));
    toast(`已删除 ${site.domain}`);
    render();
  } catch (e) { toast(e.message || String(e), "error"); }
}

/* ── 访问钥匙设置 ─────────────────────────────────────── */
function openKeySettings() {
  const cur = apiKey();
  const inp = el("input", {type:"text", placeholder:"sk-seoclaw-…",
    value:cur, style:"width:100%"});
  const listBox = el("div", {style:"margin-top:16px"});
  const issued = el("div", {style:"margin-top:12px"});

  const m = modal("访问钥匙", el("div", {},
    el("div", {class:"fld"},
      el("label", {}, "本机使用的钥匙（X-API-Key）"),
      inp,
      el("div", {class:"hint"},
        "单机部署可以留空。多个租户时，每个租户一把钥匙，只能看到自己的站点。")),
    el("div", {style:"display:flex;gap:8px;flex-wrap:wrap"},
      el("button", {class:"btn btn-p", onclick: () => {
        const v = inp.value.trim();
        setApiKey(v);
        m.close();
        toast(v ? "钥匙已保存，正在按新归属重新加载" : "已清除钥匙");
        S.sites = []; S.siteId = null;
        boot();
      }}, "保存"),
      cur ? el("button", {class:"btn btn-g", onclick: () => {
        setApiKey(""); m.close();
        toast("已清除钥匙");
        S.sites = []; S.siteId = null; boot();
      }}, "清除") : null,
      el("button", {class:"btn", onclick: () => mintKey(issued)}, "签发新钥匙")),
    issued,
    listBox));

  void issued; void listBox;
  refreshKeys(listBox);
  void m;
}

/** 签发一把钥匙。⚠️ 明文只在这里出现一次 —— 服务端只存哈希，丢了找不回。 */
async function mintKey(out) {
  out.textContent = "签发中…";
  try {
    const r = await API.createKey();
    out.textContent = "";
    const box = el("code", {
      style:"display:block;margin-top:6px;padding:10px;font-size:13px;word-break:break-all",
    }, r.key);
    out.append(
      el("div", {class:"err", style:"background:var(--bg-sunken);border-color:var(--medium)"},
        el("div", {class:"t"}, "这是唯一一次显示完整钥匙"),
        el("div", {class:"n"}, r.warning),
        box,
        el("div", {style:"margin-top:8px"},
          el("button", {class:"btn btn-sm", onclick: () => {
            // Clipboard API 在非 https 下可能不可用，所以给回退
            const done = () => toast("已复制");
            if (navigator.clipboard && navigator.clipboard.writeText)
              navigator.clipboard.writeText(r.key).then(done).catch(() => toast("复制失败，请手动选中", "error"));
            else { toast("浏览器不允许复制，请手动选中", "error"); }
          }}, "复制"))));
    toast("已签发");
  } catch (e) {
    out.textContent = "";
    out.append(errBox(e, "开鉴权后签发需要管理令牌（服务端 SEO_CLAW_ADMIN_TOKEN）。"));
  }
}

/** 已签发的钥匙列表。⚠️ 只回前缀 —— 完整钥匙不在库里，也没理由展示。 */
async function refreshKeys(box) {
  box.textContent = "加载中…";
  try {
    const ks = await API.listKeys();
    box.textContent = "";
    if (!ks.length) {
      box.append(el("div", {style:"color:var(--fg-faint);font-size:12px;padding:8px 0"},
        "还没有签发过钥匙。"));
      return;
    }
    const rows = ks.map(k => el("tr", {},
      el("td", {style:"font:500 12px/1.4 var(--mono)"}, k.key_prefix + "…"),
      el("td", {}, k.name),
      el("td", {style:"font:400 12px/1.4 var(--mono);color:var(--fg-faint)"},
        k.revoked ? "已撤销" : (k.last_used_at
          ? new Date(k.last_used_at).toLocaleString("zh-CN") : "从未使用")),
      el("td", {}, k.revoked
        ? el("span", {class:"tag"}, "已撤销")
        : el("button", {class:"btn btn-sm", onclick: async () => {
            if (!window.confirm(`撤销 ${k.key_prefix}…？\n\n撤销后这把钥匙立刻失效，无法恢复。`)) return;
            try { await API.revokeKey(k.id); toast("已撤销"); refreshKeys(box); }
            catch (e) { toast(e.message || String(e), "error"); }
          }}, "撤销"))));
    box.append(
      el("div", {style:"font:600 11px/1 var(--mono);color:var(--fg-muted);margin:14px 0 6px"},
        "已签发的钥匙"),
      el("table", {},
        el("thead", {}, el("tr", {},
          el("th", {}, "前缀"), el("th", {}, "名称"),
          el("th", {}, "最后使用"), el("th", {}, ""))),
        el("tbody", {}, rows)));
  } catch (e) {
    box.textContent = "";
    box.append(errBox(e));
  }
}

/* ══════════════════════════════════════════════════════════
   弹层：接入站点 / 开始体检
   ══════════════════════════════════════════════════════════ */
function modal(title, bodyNode, onClose) {
  function close() { scrim.remove(); onClose && onClose(); }

  const boxStyle = [
    "background:var(--bg-raised)",
    "border:1px solid var(--border-strong)",
    "border-radius:var(--r-panel)",
    "width:min(560px,100%)",
    "max-height:86vh",
    "overflow-y:auto",
  ].join(";");

  const head = el("div", {class:"panel-h", style:"padding:14px 16px"},
    el("h2", {}, title),
    el("div", {class:"spacer"}),
    el("button", {class:"btn btn-sm btn-g", onclick:() => close()}, "关闭"));

  const box = el("div", {style: boxStyle},
    head,
    el("div", {class:"panel-b"}, bodyNode));

  const scrim = el("div", {
    style:"position:fixed;inset:0;background:oklch(0 0 0/.62);display:grid;place-items:center;padding:20px;z-index:50",
    onclick: (e) => { if (e.target === scrim) close(); },
  });
  scrim.append(box);
  document.body.append(scrim);

  const f = box.querySelector("input,select");
  if (f) f.focus();

  document.addEventListener("keydown", function esc(e) {
    if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc); }
  });
  return {close};
}

function openAdd() {
  const dom = el("input", {type:"text", placeholder:"example.com"});
  const mk  = el("input", {type:"text", placeholder:"base, google, baidu", value:"base"});
  const out = el("div", {style:"margin-top:12px"});

  async function submit() {
    const d = dom.value.trim();
    if (!d) { dom.setAttribute("aria-invalid", "true"); return; }
    try {
      const markets = mk.value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
      const created = await API.createSite({domain: d, markets});
      m.close();
      S.sites = await API.sites();
      S.siteId = created.id;
      S.tab = "overview";
      toast(`已接入 ${created.domain}，跑一次体检就有结论了`);
      render();
    } catch (e) {
      out.textContent = "";
      out.append(errBox(e));
    }
  }

  const body = el("div", {},
    el("div", {class:"fld"},
      el("label", {}, "域名"), dom,
      el("div", {class:"hint"}, "只填域名，不要带 https:// 和路径。")),
    el("div", {class:"fld"},
      el("label", {}, "检查市场"), mk,
      el("div", {class:"hint"},
        "base 是通用规则；google / baidu / cnh_eco 是各生态专属规则。")),
    el("button", {class:"btn btn-p", onclick: submit}, "接入"),
    out);

  const m = modal("接入站点", body);
  dom.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
}

function openScan(site) {
  const pages = el("input", {type:"number", value:"100", min:"1", max:"5000"});
  const rps   = el("input", {type:"number", value:"3", min:"0.2", step:"0.5"});
  const depth = el("input", {type:"number", value:"6", min:"0", max:"20"});
  const js    = el("select", {},
    el("option", {value:"false"}, "否（快，静态 HTML）"),
    el("option", {value:"true"},  "是（慢，能看 JS 渲染后的页面）"));

  function start() {
    const body = {
      max_pages: Math.max(1, +pages.value || 100),
      max_depth: Math.max(0, +depth.value || 6),
      per_domain_rps: Math.max(0.2, +rps.value || 3),
      render_js: js.value === "true",
    };
    m.close();
    withBusy(`scan:${site.id}`, async () => {
      const r = await API.scan(site.id, body);
      S.sites = await API.sites().catch(() => S.sites);
      toast(`扫描完成：抓了 ${r.pages_crawled ?? "?"} 页`);
      render();
    }).catch(() => {});
  }

  const field = (label, node, hint) => el("div", {class:"fld"},
    el("label", {}, label), node,
    hint ? el("div", {class:"hint"}, hint) : null);

  const body = el("div", {},
    el("div", {class:"row"},
      field("最多抓几页", pages, "3 rps 下，1000 页约 5.6 分钟，这是物理下界。"),
      field("最大深度", depth)),
    el("div", {class:"row"},
      field("每秒请求数", rps, "调高会让对方站点更快把你拉黑。"),
      field("渲染 JS", js)),
    el("button", {class:"btn btn-p", onclick: start}, "开始"));

  const m = modal(`体检 ${site.domain}`, body);
}

/* ══════════════════════════════════════════════════════════
   启动
   ══════════════════════════════════════════════════════════ */
$("#btnAdd").addEventListener("click", openAdd);
$("#btnKey").addEventListener("click", openKeySettings);
(async function boot() {
  try {
    S.sites = await API.sites();
    if (S.sites.length === 1) S.siteId = S.sites[0].id;
    $("#brandSub").textContent = `${S.sites.length} 个站点`;
  } catch (e) {
    $("#brandSub").textContent = "服务未连接";
    $("#siteList").append(errBox(e, "确认后端已启动，并加载了最新代码。"));
  }
  render();
  // 扫描进行中时轻量轮询，让「开始体检」有真实的进行中反馈
  setInterval(() => { if ([...S.busy.keys()].some(k=>k.startsWith("scan:"))) render(); }, 2000);
})();
</script>
