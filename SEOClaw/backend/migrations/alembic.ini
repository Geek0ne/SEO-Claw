# Alembic 配置。
#
# 放在 migrations/ 目录内（而不是 backend/ 根），是为了让"迁移相关的文件"
# 自成一块：复制部署时只要带走这个目录。代价是运行时要用 -c 指定配置文件
# 路径，见 README 或 Makefile 里的 `alembic -c migrations/alembic.ini`。
#
# 关键点：script_location 指向本目录，与 env.py 所在位置一致。

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/..
file_template = %%(rev)s_%%(slug)s

# 迁移产物是版本化代码，必须进版本库，所以不做自动改时间戳后缀。
timezone = UTC

# 下面三个 DB API 由 env.py 从 DATABASE_URL 推导后覆盖，
# 这里留空是为了避免"配置里写死一套连接串、日志里又出现明文密码"。
sqlalchemy.url =

[post_write_hooks]
# 格式化交给 ruff，与 CI 保持一致；lint 未安装时静默跳过。
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
