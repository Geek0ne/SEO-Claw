name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# ⚠️ 同一分支的新提交会取消在跑的旧 run。
# 这个项目的测试 12 秒就完事，并发跑纯属浪费额度。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 + 四道闸验收
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 装依赖
        # ⚠️ **两版都错过，这里是两次翻车换来的结论：**
        #
        #   1. `pip install -r requirements.txt` → `pytest: command not found`
        #      pytest 在 pyproject 的 dev extra 里，不在 requirements.txt 里。
        #
        #   2. `pip install -e ".[dev]"` → `No module named 'fastapi'`
        #      dev extra 里**只有 pytest**，fastapi/uvicorn 在 api extra 里。
        #      为了补一个洞把另一个踹开了。
        #
        # **测试要覆盖全部三层**（rules / db / web），所以 api + dev 都要装。
        # 这两条教训写在 extra 名称旁边比记在脑子里靠谱——
        # 我在这个文件的第一条注释里写过「依赖要真实装一遍」，
        # 结果写完 40 分钟就自己用同一种方式犯了一遍。
        run: pip install -e ".[api,dev]"

      - name: 全量测试 + 覆盖率
        # ⚠️ --cov-fail-under 是**及格线，不是目标**。
        # 实测当前 82%。定 78 是留一点余量：覆盖率会因为加了几行
        # 胶水代码就轻微波动，卡死在 82 只会天天红，而天天红的门
        # 等于没门。真正的目标是往上推，不是守住一条线。
        run: |
          cd backend
          pytest tests -q \
            --cov=seoclaw \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=78
        env:
          COVERAGE_FILE: .coverage

      - name: CLI 冒烟（规则清单必须能列出来）
        # ⚠️ 别省这步。规则注册表加载失败时，pytest 可能因为
        # 自己的 import 路径而「恰好没碰到」那条路径，
        # 但真正 `seoclaw rules` 一跑就炸。
        run: python -m seoclaw.cli rules | head -5

      - name: 包能构建
        # ⚠️ 也是别省的那类。源码跑得通 ≠ 能装成 wheel。
        # 我今天就踩过：pyproject 写 `SQLAlchemy>=2.0`，
        # 装出来的同步版一 import asyncio 就炸——而本地 .deps/ 里
        # greenlet 早就躺在那儿，压根照不出来。
        run: |
          pip install build
          python -m build --wheel
          ls -la dist/

  guard:
    name: 四道闸真容器验收
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 打闸
        # ⚠️ 这是最容易被省掉、也最不该省的一步。
        # 单元测试测的是「函数被调用时返回什么」；
        # 这个脚本测的是「一个真跑起来的容器，面对真 HTTP 请求，
        # 会不会真的拦」。路由没挂上、装饰器位置错、依赖没装 ——
        # 这些单测全绿，线上照样裸奔。
        #
        # 曾经真踩过：用 .example 当黑名单测试目标，拿回 400 就当通过，
        # 实际那 400 是前面 SSRF 的 DNS 校验给的，请求压根没走到黑名单。
        #
        # ⚠️ `| tee` + `set -o pipefail`：没有 pipefail 的话，脚本失败会被
        # tee 的成功退出码吃掉，CI 照样绿 —— 那这道门就成了摆设。
        # 我第一次写就漏了 pipefail，正好是这个脚本自己教我的：
        # **测试没测到目标，和目标真通过，长得一模一样。**
        run: |
          set -o pipefail
          ./tools/guard_smoke.sh 2>&1 | tee guard-smoke.log

      - name: 存下闸的日志
        # ⚠️ `if: always()`：闸挂了才最需要看日志。默认只在成功时上传，
        # 那就等于「只在没事的时候留证据」。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guard-smoke-log
          path: guard-smoke.log
          if-no-files-found: ignore
          retention-days: 14
