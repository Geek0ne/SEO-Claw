# pre-commit 钩子：挡低级错误，不挡节奏
#
# 启用：pip install pre-commit && pre-commit install
# 手动全量：pre-commit run --all-files
#
# ⚠️ 刻意只上「机械性检查」：行尾空白、文件末换行、YAML 可解析、
# 大文件/合并冲突标记、私钥误提交。lint（ruff）不在钩子里改写——
# 这个仓库的注释文化（事故记录式长注释）会被格式化工具搅乱，
# 钩子只负责挡事故，不负责改写风格；静态检查走 CI 的 lint 任务
# （见 .github/workflows/ci.yml），那里只报不改，改不改由人定。
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]   # reports/ 证据 JSON 允许到 2MB
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
