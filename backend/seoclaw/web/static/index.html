<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEO-Claw · 站点 SEO 审计</title>
<!--
  SEO-Claw Web —— 全功能工作台
  ⚠️ 零外部依赖：无 Web Font、无 CDN、无外部 CSS/JS。私有化部署、离线可用。
  设计系统见 DESIGN.md（唯一事实来源）：纸白墨黑、琥珀强调、印章红仅用于
  严重级徽标、零阴影、圆角只用 2px/4px、数字与规则编号用等宽体。
  所有接口路径照 backend OpenAPI 契约，不凭印象。
-->
<style>
:root{
  --bg:oklch(0.985 0.002 90); --surface:oklch(1 0 0); --bg-sunken:oklch(0.965 0.003 90);
  --fg:oklch(0.21 0.01 90); --fg-2:oklch(0.42 0.01 90); --muted:oklch(0.58 0.008 90);
  --line:oklch(0.91 0.004 90); --line-strong:oklch(0.82 0.006 90);
  --accent:oklch(0.52 0.115 62); --accent-soft:oklch(0.95 0.03 80);
  --stamp:oklch(0.48 0.16 25);
  --ok:oklch(0.45 0.09 150); --warn:oklch(0.55 0.11 65); --err:oklch(0.48 0.16 25);
  --sans:"IBM Plex Sans","IBM Plex Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-ctl:2px; --r-card:4px; --sp:4px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:400 14.5px/1.65 var(--sans);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── 布局 ─────────────────────────────────────────── */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{background:var(--bg-sunken);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{padding:20px 18px 14px;border-bottom:1px solid var(--line)}
.brand b{font-size:16px;font-weight:600;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font:500 11px/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.side-scroll{flex:1;overflow-y:auto;padding:10px 12px}
.side-h{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 6px 8px}
.nav-item{display:block;width:100%;text-align:left;background:none;border:0;border-radius:var(--r-ctl);
  padding:9px 10px;cursor:pointer;color:var(--fg-2);transition:background 120ms ease-out,color 120ms ease-out}
.nav-item:hover{background:var(--surface);color:var(--fg)}
.nav-item[aria-current="true"]{background:var(--surface);color:var(--fg);border:1px solid var(--line-strong);padding:8px 9px;font-weight:600}
.site-item .d{font-size:13px;font-weight:500;word-break:break-all}
.site-item .m{font:400 11px/1.5 var(--mono);color:var(--muted);margin-top:2px}
.side-foot{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px}
.main{padding:28px 32px 56px;overflow-x:hidden}
.wrap{max-width:940px}
@media (max-width:880px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:18px}}

/* ── 标题区 ───────────────────────────────────────── */
.page-title{font-size:25px;font-weight:600;line-height:1.2;margin:0}
.page-sub{color:var(--muted);font-size:13px;margin:6px 0 0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}

/* ── 卡片 ─────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:20px 22px;margin-bottom:18px}
.card h2{font-size:15px;font-weight:600;margin:0 0 12px}
.card h3{font-size:13px;font-weight:600;margin:18px 0 8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:720px){.g2,.g3{grid-template-columns:1fr}}

/* ── 统计块（无阴影、边框相连） ───────────────────── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;background:var(--surface)}
.stat{padding:14px 16px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .k{font:500 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:500 22px/1.2 var(--mono);margin-top:4px;font-variant-numeric:tabular-nums}
.stat .x{font-size:11px;color:var(--muted);margin-top:2px}

/* ── 健康分量规（签名动作：带刻度的尺） ───────────── */
.gauge{margin:6px 0 2px}
.gauge .val{font:500 56px/1 var(--mono);font-variant-numeric:tabular-nums}
.gauge .val small{font-size:18px;color:var(--muted)}
.gauge svg{display:block;width:100%;height:34px;margin-top:6px}
.gauge .lbl{display:flex;justify-content:space-between;font:500 10px/1 var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:2px}

/* ── 页签 ─────────────────────────────────────────── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:20px 0 20px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;cursor:pointer;
  color:var(--fg-2);white-space:nowrap;font-size:13.5px}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);font-weight:600;border-bottom-color:var(--accent)}

/* ── 表格 ─────────────────────────────────────────── */
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:500 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-strong)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.mono{font-family:var(--mono);font-size:12px}
.rule-id{font:500 11px/1.4 var(--mono);letter-spacing:.04em;color:var(--fg-2);background:var(--bg-sunken);
  border:1px solid var(--line);border-radius:var(--r-ctl);padding:1px 6px;white-space:nowrap}

/* ── 徽标：颜色永不单独表意 ───────────────────────── */
.sev{display:inline-flex;align-items:center;gap:4px;font:500 11px/1.6 var(--mono);letter-spacing:.04em;
  padding:1px 8px;border-radius:var(--r-ctl);border:1px solid var(--line-strong);white-space:nowrap}
.sev-critical{border-color:var(--stamp);color:var(--stamp)}
.sev-high{border-color:var(--warn);color:var(--warn)}
.sev-medium{border-color:var(--accent);color:var(--accent)}
.sev-low{border-color:var(--line-strong);color:var(--fg-2)}
.sev-info{border-color:var(--line);color:var(--muted)}
.pill{display:inline-block;font:500 11px/1.6 var(--mono);padding:1px 8px;border:1px solid var(--line-strong);
  border-radius:var(--r-ctl);color:var(--fg-2);white-space:nowrap}

/* ── 按钮 ─────────────────────────────────────────── */
.btn{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-ctl);
  padding:9px 16px;cursor:pointer;font-size:13.5px;transition:background 120ms ease-out,border-color 120ms ease-out}
.btn:hover{background:var(--bg-sunken)}
.btn:active{border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:600}
.btn-primary:hover{background:oklch(0.3 0.01 90)}
.btn-danger{border-color:var(--stamp);color:var(--stamp)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ── 表单 ─────────────────────────────────────────── */
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fld label{font:500 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line-strong);border-radius:var(--r-ctl);
  padding:10px 12px;background:var(--surface);min-height:42px}
.fld input:focus-visible,.fld select:focus-visible,.fld textarea:focus-visible{border-color:var(--accent)}
.fld .hint{font-size:11.5px;color:var(--muted)}
/* 文件选择框：默认样式在纸上会顶出一条灰带，这里压成与控件同规格的 2px 边框 */
.fld input[type=file]{padding:8px 10px;background:var(--bg-sunken);font-size:12.5px}
.fld input[type=file]::file-selector-button{border:1px solid var(--line-strong);background:var(--surface);
  padding:6px 10px;border-radius:var(--r-ctl);font:500 12px var(--mono);cursor:pointer;margin-right:10px}
.fld textarea{width:100%;line-height:1.6}
.fld-row{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
@media (max-width:640px){.fld-row{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-size:13px}
.chk input{width:17px;height:17px;accent-color:var(--accent)}

/* ── 状态块 ───────────────────────────────────────── */
.empty,.err-box,.note{border:1px solid var(--line);border-radius:var(--r-card);padding:18px 20px;background:var(--surface)}
.empty .t,.err-box .t{font-weight:600;margin-bottom:4px}
.empty .d,.err-box .d{color:var(--fg-2);font-size:13px}
.err-box{border-color:var(--stamp)}
.err-box .t{color:var(--stamp)}
.note{background:var(--accent-soft);border-color:var(--line);color:var(--fg-2);font-size:12.5px}
.note.warn{background:oklch(0.96 0.03 75)}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);padding:18px 0;font-size:13px}
.spin{width:14px;height:14px;border:2px solid var(--line-strong);border-top-color:var(--accent);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.progress{height:6px;background:var(--bg-sunken);border:1px solid var(--line);border-radius:var(--r-ctl);overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width 600ms ease-out}

/* ── 弹层 ─────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:oklch(0.2 0.01 90 / .35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:40}
.modal{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-card);
  width:min(560px,100%);max-height:88vh;overflow:auto;padding:22px 24px}
.modal h2{margin:0 0 14px;font-size:17px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--fg);color:var(--bg);border-radius:var(--r-ctl);padding:10px 16px;font-size:13px;
  max-width:360px;animation:fade 200ms ease-out}
.toast.err{background:var(--stamp)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── 趋势线 ───────────────────────────────────────── */
.spark svg{width:100%;height:64px;display:block}
.spark .ln{fill:none;stroke:var(--accent);stroke-width:2}
.spark .gl{stroke:var(--line);stroke-width:1}
.spark .ar{fill:var(--fg)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;word-break:break-all}
pre{background:var(--bg-sunken);border:1px solid var(--line);border-radius:var(--r-ctl);padding:12px 14px;
  overflow-x:auto;font:400 12px/1.7 var(--mono)}
code{font:400 12px/1.6 var(--mono);background:var(--bg-sunken);padding:1px 5px;border-radius:2px}
.badge-count{font:500 11px/1.6 var(--mono);background:var(--bg-sunken);border:1px solid var(--line);
  border-radius:var(--r-ctl);padding:0 6px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <!-- ══ 左栏 ══ -->
  <aside class="side">
    <div class="brand"><b>SEO-Claw</b><small>Evidence-based SEO audit</small></div>
    <div class="side-scroll">
      <button class="nav-item" id="navDashboard" onclick="go('#/dashboard')">仪表盘</button>
      <button class="nav-item" id="navScan" onclick="go('#/scan')">一键体检</button>
      <div class="side-h">站点</div>
      <div id="siteList"></div>
    </div>
    <div class="side-foot">
      <button class="btn" id="btnAdd" style="flex:1;justify-content:center">+ 接入站点</button>
      <button class="btn" id="btnSettings" title="设置 · 钥匙 · 系统状态" style="flex:none">⚙</button>
    </div>
  </aside>

  <!-- ══ 主区 ══ -->
  <main class="main"><div class="wrap" id="main"></div></main>
</div>
<div id="toast"></div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════
   API 层 —— 全部照 backend OpenAPI 契约，不凭印象
   ══════════════════════════════════════════════════════════ */
/* 钥匙存在 localStorage。⚠️ 明文钥匙只在浏览器里存在，服务端只存哈希，
   所以丢了只能重新签发——界面会明确告诉用户，别让人以为能找回。*/
const KEY_STORE = "seoclaw.api_key";
const apiKey = () => { try { return localStorage.getItem(KEY_STORE) || ""; } catch { return ""; } };
function setApiKey(v) {
  try { v ? localStorage.setItem(KEY_STORE, v) : localStorage.removeItem(KEY_STORE); } catch {}
}

const API = {
  async req(method, path, body) {
    const k = apiKey();
    const opt = { method, headers: k ? {"X-API-Key": k} : {} };
    if (body !== undefined) {
      opt.headers["Content-Type"] = "application/json";
      opt.body = JSON.stringify(body);
    }
    const res = await fetch(path, opt);
    const txt = await res.text();
    let data = null;
    try { data = txt ? JSON.parse(txt) : null; } catch { data = null; }
    if (!res.ok) {
      // 错误必须说清「是什么、下一步」——不许只抛一句红色
      const raw = (data && (data.detail || data.reason)) ||
                  (typeof data === "string" && data) || `HTTP ${res.status}`;
      let e;
      if (raw && typeof raw === "object") {
        // 导入类端点的 detail 是 {message, errors}：message 当话术，errors
        // 挂在异常上由界面逐条渲染。整包 JSON.stringify 甩给用户，等于把
        // 「第 3 行日期不对」这种真正有用的东西埋进一串花括号里。
        e = new Error(raw.message || raw.reason || JSON.stringify(raw));
        e.errors = raw.errors || [];
      } else {
        e = new Error(String(raw));
      }
      e.status = res.status; e.data = data;
      throw e;
    }
    return data;
  },
  get:  p       => API.req("GET", p),
  post: (p,b)   => API.req("POST", p, b ?? {}),
  patch:(p,b)   => API.req("PATCH", p, b),
  put:  (p,b)   => API.req("PUT", p, b),
  del:  p       => API.req("DELETE", p),
  // —— 站点 / 扫描 ——
  sites:      ()        => API.get("/api/v1/sites"),
  createSite: b         => API.post("/api/v1/sites", b),
  site:       id        => API.get(`/api/v1/sites/${id}`),
  deleteSite: id        => API.del(`/api/v1/sites/${id}`),
  scan:       (id,b)    => API.post(`/api/v1/sites/${id}/scan`, b),
  jobs:       id        => API.get(`/api/v1/sites/${id}/jobs`),
  quickScan:  b         => API.post("/api/v1/web/quick-scan", b),
  quickJob:   jid       => API.get(`/api/v1/web/jobs/${jid}`),
  // —— 托管定时复扫（保存这一刻定格成执行参数快照）——
  schedule:   id        => API.get(`/api/v1/sites/${id}/schedule`),
  setSchedule:(id,b)    => API.put(`/api/v1/sites/${id}/schedule`, b),
  // —— 报告 / 问题 ——
  report:     id        => API.get(`/api/v1/sites/${id}/report`),
  aiSummary:  id        => API.get(`/api/v1/sites/${id}/report/summary`),
  exportUrl:  (id,fmt)  => `/api/v1/sites/${id}/report/export?format=${fmt}`,
  fixpackUrl: (id,fmt,brand) =>
              `/api/v1/sites/${id}/fixpack?format=${fmt}`
              + (brand ? `&brand=${encodeURIComponent(brand)}` : ""),
  issues:     (id,q)    => API.get(`/api/v1/sites/${id}/issues` + (q||"")),
  setIssue:   (id,iid,st) => API.patch(`/api/v1/sites/${id}/issues/${iid}`, {status:st}),
  bulkIssue:  (id,fp,st)  => API.patch(`/api/v1/sites/${id}/issues`, {fingerprint:fp,status:st}),
  // —— 趋势 / 历史 ——
  trend:      id        => API.get(`/api/v1/sites/${id}/trend`),
  // —— 智能层 ——
  keywords:   id        => API.get(`/api/v1/sites/${id}/keywords?limit=200`),
  expandKw:   (id,b)    => API.post(`/api/v1/sites/${id}/keywords/expand`, b),
  brief:      (id,b)    => API.post(`/api/v1/sites/${id}/brief`, b),
  rankDrops:  (id,b)    => API.post(`/api/v1/sites/${id}/rank-drops`, b),
  ackDrops:   (id,keys) => API.post(`/api/v1/sites/${id}/rank-drops/ack`, {alert_keys:keys}),
  // —— 数据导入：前端**不解析**，只搬运文本，口径在服务器一份 —— //
  // 界面 FileReader 拿到的是纯文本，没有后缀可问，所以格式判定也交给
  // serpdata.detect_format（与 CLI 同一个函数）。
  importRankCsv:(id,text)       => API.post(`/api/v1/sites/${id}/rankings/import`, {text}),
  rankings:   (id,days) => API.get(`/api/v1/sites/${id}/rankings?days=${days||30}`),
  importSerpRaw:(id,text,format)=> API.post(`/api/v1/sites/${id}/serp/import`,
                                  format ? {text, format} : {text}),
  serp:       (id,q)    => API.get(`/api/v1/sites/${id}/serp` + (q||"")),
  // —— 计量 / 租户 ——
  usage:      id        => API.get(`/api/v1/sites/${id}/usage`),
  me:         ()        => API.get("/api/v1/me"),
  listKeys:   ()        => API.get("/api/v1/keys"),
  createKey:  b         => API.post("/api/v1/keys", b||{}),
  revokeKey:  kid       => API.post(`/api/v1/keys/${kid}/revoke`),
  verification:    id   => API.get(`/api/v1/sites/${id}/verification`),
  startVerification: id => API.post(`/api/v1/sites/${id}/verification`),
  checkVerification: (id, method) =>
                    API.post(`/api/v1/sites/${id}/verification/check?method=${method}`),
  health:     ()        => API.get("/api/v1/health"),
};

/* ══════════════════════════════════════════════════════════
   工具
   ══════════════════════════════════════════════════════════ */
const $  = (s,r=document) => r.querySelector(s);
const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) {
    if (c === null || c === undefined || c === false) continue;
    n.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return n;
};
const SEV = ["critical","high","medium","low","info"];
const SEV_LABEL = {critical:"严重",high:"高",medium:"中",low:"低",info:"提示"};
const sevTag = s => el("span",{class:`sev sev-${s}`,title:SEV_LABEL[s]||s}, SEV_LABEL[s]||s);
const STATUS_LABEL = {open:"待处理",acknowledged:"已知晓",fixed:"已修复",ignored:"已忽略",false_positive:"误报"};
const MARKETS = [
  ["base","通用 base"],["google","Google"],["baidu","百度"],
  ["cnh_eco","微信搜一搜"],["geo","AI 搜索引用性（实验）"],
];

/* null 与 0 必须分开显示：0 分是「抓到了但全是问题」，
   null 是「一页都没抓到」——显示成同一个东西会让用户误判该做什么。*/
const num  = v => (v === null || v === undefined) ? "—" : v;
const esc  = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime = iso => {
  if (!iso) return "—";
  const d = new Date(iso);
  return isNaN(d) ? "—" : d.toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
};

function toast(msg, kind="info") {
  const t = el("div",{class:"toast" + (kind==="err"?" err":"")}, msg);
  $("#toast").append(t);
  setTimeout(() => t.remove(), 4200);
}

function loading(t="加载中…") {
  return el("div",{class:"loading"}, el("div",{class:"spin"}), t);
}
function emptyBox(title, desc, action) {
  return el("div",{class:"empty"}, el("div",{class:"t"},title), el("div",{class:"d"},desc),
    action ? el("div",{style:"margin-top:12px"},action) : null);
}
function errBox(e, hint) {
  return el("div",{class:"err-box"}, el("div",{class:"t"},"请求失败"),
    el("div",{class:"d"}, e.message || String(e)),
    hint ? el("div",{class:"d",style:"margin-top:8px"},hint) : null);
}

/* ── 健康分量规：0–100 的尺，不是进度条（DESIGN.md 签名动作） ── */
function gauge(score) {
  const has = !(score === null || score === undefined);
  const v = has ? Math.max(0, Math.min(100, score)) : 0;
  const ticks = [];
  for (let i = 0; i <= 100; i += 2) {
    const x = 2 + i * 5.96, h = i % 10 === 0 ? 12 : 6;
    ticks.push(`<line x1="${x}" y1="${16-h}" x2="${x}" y2="16" stroke="oklch(0.82 0.006 90)" stroke-width="1"/>`);
  }
  const mx = 2 + v * 5.96;
  return el("div",{class:"gauge", title: has ? `健康分 ${Math.round(v)}` : "没有可评分的数据：一页都没抓到"},
    el("div",{class:"val"},
      has ? String(Math.round(v)) : el("span",{style:"color:var(--muted)"},"—"),
      el("small",{}," / 100")),
    el("div",{html:`<svg viewBox="0 0 600 22" preserveAspectRatio="none" role="img"
      aria-label="${has ? `健康分 ${Math.round(v)}，刻度 0 到 100` : "暂无分数"}">
      <line x1="2" y1="16" x2="598" y2="16" stroke="oklch(0.82 0.006 90)" stroke-width="1"/>
      ${ticks.join("")}
      ${has ? `<line x1="${mx}" y1="2" x2="${mx}" y2="19" stroke="oklch(0.21 0.01 90)" stroke-width="3"/>` : ""}
    </svg>`}),
    el("div",{class:"lbl"}, el("span",{},"0"), el("span",{},"50"), el("span",{},"100")));
}

function sparkline(points) {
  const pts = (points||[]).filter(p => p && p.score !== null && p.score !== undefined);
  if (pts.length < 2) {
    return el("div",{class:"empty"}, el("div",{class:"d"},
      "至少需要两轮有分数的扫描才能画出趋势。"));
  }
  const W=520,H=64,P=6;
  const xs = i => P + i*(W-2*P)/(pts.length-1);
  const ys = s => H-P - (Math.max(0,Math.min(100,s))/100)*(H-2*P);
  const d = pts.map((p,i)=>`${i?"L":"M"}${xs(i).toFixed(1)},${ys(p.score).toFixed(1)}`).join("");
  const last = pts[pts.length-1];
  return el("div",{class:"spark"}, el("div",{html:`
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
      aria-label="健康分趋势，${pts.length} 轮，从 ${Math.round(pts[0].score)} 到 ${Math.round(last.score)}">
      <line class="gl" x1="0" y1="${ys(0)}" x2="${W}" y2="${ys(0)}"/>
      <line class="gl" x1="0" y1="${ys(100)}" x2="${W}" y2="${ys(100)}"/>
      <path class="ln" d="${d}"/>
      <circle class="ar" cx="${xs(pts.length-1).toFixed(1)}" cy="${ys(last.score).toFixed(1)}" r="3.5"/>
    </svg>`}));
}

function modal(title, bodyNode, onClose) {
  const scrim = el("div",{class:"scrim", onclick: ev => { if (ev.target === scrim) close(); }});
  const box = el("div",{class:"modal", role:"dialog", "aria-modal":"true"},
    el("h2",{},title), bodyNode);
  function close() { scrim.remove(); onClose && onClose(); }
  box.append(el("div",{class:"foot"}, el("button",{class:"btn", onclick: close},"关闭")));
  scrim.append(box);
  document.body.append(scrim);
  document.addEventListener("keydown", function esc(ev) {
    if (ev.key === "Escape") { close(); document.removeEventListener("keydown", esc); }
  });
  return { close, box };
}

/* ── 原始导出上传：文件 / 粘贴 → 交给服务器解析 ─────────────────────
   ⚠️ 刻意**不在前端解析** CSV 或 JSON。表头别名（page / average position /
   搜索词）、日期格式、坏行判定在 rankdata 与 serpdata 里各只有一份，CLI 用的
   就是那两份。前端再写一套，收场一定是「CLI 导得进、网页导不进」，而用户没法
   判断哪套口径是对的。这里只搬运文本，解析结果由调用方负责转述。
   send(text, format) 返回服务器响应；render(out, resp) 画成功侧的面。 */
function rawImportCard(o) {
  const file = el("input",{type:"file",
    accept: o.accept || ".csv,.json,text/csv,application/json"});
  const text = el("textarea",{rows:"6",
    placeholder: o.placeholder || "",
    style:"font:400 12px/1.6 var(--mono);resize:vertical"});
  const fmt = o.allowFormat ? el("select",{},
    el("option",{value:""},"自动判断（看内容开头）"),
    el("option",{value:"csv"},"CSV（一行一条结果）"),
    el("option",{value:"json"},"JSON（captures 形状）")) : null;
  const btn = el("button",{class:"btn btn-primary"},"导入");
  const out = el("div",{});

  file.addEventListener("change", async () => {
    const f = file.files && file.files[0];
    if (!f) return;
    text.value = await f.text();   // 读进来只是文本，一个字段都不解析
    toast(`已读入 ${f.name}（${Math.max(1, Math.round(f.size/1024))} KB）`);
  });

  btn.addEventListener("click", async () => {
    const t = text.value.trim();
    if (!t) { toast("先选个文件，或把内容粘进来。", "err"); return; }
    btn.disabled = true; out.textContent = ""; out.append(loading("解析并写入中…"));
    try {
      const resp = await o.send(t, fmt ? (fmt.value || null) : null);
      out.textContent = "";
      o.render(out, resp);
    } catch (e) {
      out.textContent = "";
      out.append(errBox(e));
      if (e.errors && e.errors.length) out.append(errLines(e.errors));
    } finally { btn.disabled = false; }
  });

  const pick = el("div",{class:"fld"}, el("label",{},"选文件"), file,
    el("div",{class:"hint"},"界面不解析：文本原样送服务器，与 CLI 共用同一份解析器。"));
  if (fmt) pick.append(el("label",{style:"margin-top:10px"},"格式"), fmt);

  return el("div",{class:"card"},
    el("h2",{}, o.title),
    el("p",{class:"page-sub"}, o.sub),
    pick,
    el("div",{class:"fld"}, el("label",{},"或直接粘贴内容"), text),
    el("div",{class:"btn-row"}, btn),
    out);
}

/* 逐行原因清单。坏行数得清是底线，但界面不该铺 5000 行：折叠时**必须说
   总数**，只列前 50 条却不写「还有 N 条」，用户会以为问题就这 50 个。 */
function errLines(items, cap) {
  const n = cap || 50;
  const kids = items.slice(0, n).map(x => el("div",{}, x));
  if (items.length > n) kids.push(el("div",{}, `（另有 ${items.length - n} 条同类原因未列出）`));
  return el("div",{class:"note warn"},
    el("div",{style:"font-weight:600;margin-bottom:6px"}, `未入库的行（${items.length} 条）`),
    el("div",{class:"mono",style:"font-size:11.5px"}, ...kids));
}

function parseRoute() {
  const h = (location.hash || "#/dashboard").replace(/^#\//, "");
  const [head, id, tab] = h.split("/");
  return { head: head || "dashboard", id: id ? Number(id) : null, tab: tab || "overview" };

function renderSide() {

      el("div",{class:"d"}, s.domain),

/* ══════════════════════════════════════════════════════════
   一键体检（不入库也能用）
   ══════════════════════════════════════════════════════════ */
function viewScanForm(host) {
  host.append(el("div",{class:"head"},
    el("div",{}, el("div",{class:"eyebrow"},"Quick scan"),
      el("h1",{class:"page-title"},"一键体检"),
      el("p",{class:"page-sub"},"输一个网址，后台扫描并轮询进度。支持实验规则包 geo。"))));

  const url = el("input",{placeholder:"example.com 或 https://example.com", autocomplete:"off"});
  const market = el("select",{}, MARKETS.map(([v,l]) => el("option",{value:v},l)));
  const maxPages = el("input",{type:"number",value:"30",min:"1",max:"500"});
  const maxDepth = el("input",{type:"number",value:"6",min:"1",max:"12"});
  const robots = el("input",{type:"checkbox",checked:true});
  const js = el("input",{type:"checkbox"});

  const progress = el("div",{style:"display:none"});
  const result = el("div",{});
  const submit = el("button",{class:"btn btn-primary"},"开始体检");

  submit.addEventListener("click", async () => {
    if (!url.value.trim()) { toast("请输入网址","err"); url.focus(); return; }
    submit.disabled = true; result.textContent = "";
    progress.style.display = ""; progress.textContent = "";
    try {
      const accepted = await API.quickScan({
        url: url.value.trim(),
        market: market.value,
        max_pages: Number(maxPages.value) || 30,
        max_depth: Number(maxDepth.value) || 6,
        respect_robots: robots.checked,
        render_js: js.checked,
      });
      const bar = el("div",{class:"progress"}, el("i",{}));
      const label = el("div",{class:"page-sub"}, `任务 #${accepted.job_id} 已启动（${accepted.domain}）…`);
      progress.append(bar, label);
      // 轮询到终态。任务不存在（404）= 服务重启过，必须说出来而不是无限转圈。
      for (;;) {
        let st;
        try { st = await API.quickJob(accepted.job_id); }
        catch (e) {
          if (e.status === 404) { progress.textContent = ""; progress.append(label,
            el("div",{class:"note warn"},"任务已失效（服务可能重启过），请重新发起体检。")); return; }
          throw e;
        }
        if (st.status === "done") {
          bar.firstChild.style.width = "100%";
          label.textContent = `完成，用时 ${st.elapsed}s`;
          result.append(scanResult(accepted, st));
          // 报告落库了，站点可直接进入工作台
          result.append(el("div",{class:"btn-row",style:"margin-top:14px"},
            el("button",{class:"btn btn-primary", onclick: () => go(`#/site/${accepted.site_id}/overview`)},"进入工作台")));
          return;
        }
        if (st.status === "failed") {
          progress.textContent = "";
          progress.append(errBox(new Error(st.error || "未知错误"),
            "可以先减小「最大页数」或关掉 JS 渲染重试。"));
          return;
        }
        bar.firstChild.style.width = Math.min(95, st.elapsed * 3) + "%";
        label.textContent = `扫描中… ${st.elapsed}s（限时速3 req/s，大站较慢是正常的）`;
        await new Promise(r => setTimeout(r, 2000));
      }
    } catch (e) {
      progress.textContent = ""; progress.append(errBox(e));
    } finally { submit.disabled = false; }
  });

  host.append(el("div",{class:"card"},
    el("div",{class:"fld-row"},
      el("div",{class:"fld"}, el("label",{},"目标网址"), url),
      el("div",{class:"fld"}, el("label",{},"规则包"), market,
        el("div",{class:"hint"},"geo 为实验性规则包，证据强度弱于常规包"))),
    el("div",{class:"fld-row"},
      el("div",{class:"fld"}, el("label",{},"最大页数"), maxPages),
      el("div",{class:"fld"}, el("label",{},"最大深度"), maxDepth)),
    el("div",{class:"btn-row"},
      el("label",{class:"chk"}, robots, "遵守 robots.txt"),
      el("label",{class:"chk"}, js, "JS 渲染（慢 10–50 倍，需已装浏览器）")),
    el("div",{style:"margin-top:14px"}, submit),
    progress, result));
}

function scanResult(accepted, st) {
  const rep = st.report || {};
  const counts = rep.counts || {};
  return el("div",{class:"card",style:"margin-top:16px"},
    el("h2",{},"体检结果"),
    el("div",{class:"stats"},
      el("div",{class:"stat"}, el("div",{class:"k"},"健康分"),
        el("div",{class:"v"}, rep.health_score != null ? String(Math.round(rep.health_score)) : "—")),
      el("div",{class:"stat"}, el("div",{class:"k"},"覆盖页"),
        el("div",{class:"v"}, String(rep.pages_crawled ?? 0))),
      ...SEV.map(k => el("div",{class:"stat"}, el("div",{class:"k"},SEV_LABEL[k]),
        el("div",{class:"v"}, String(counts[k] || 0))))),
    (rep.issues||[]).length ? el("div",{},
      el("h3",{},"优先处理"),
      el("table",{}, ...rep.issues.slice(0,5).map(i => el("tr",{},
        el("td",{},sevTag(i.severity)),
        el("td",{class:"mono"},el("span",{class:"rule-id"},i.code)),
        el("td",{},i.title))))) : null);
}

/* ── 概览 ─────────────────────────────────────────── */
async function tabOverview(host, site) {
  const rep = await API.report(site.id);
  const counts = rep.counts || {};
  const total = SEV.reduce((a,k)=>a+(counts[k]||0),0);
  host.textContent = "";

  host.append(el("div",{class:"card"},
    el("h2",{},"健康分"),

      ...SEV.map(k => el("div",{class:"stat"},
        el("div",{class:"k"},SEV_LABEL[k]),
        el("div",{class:"v"}, String(counts[k] || 0)))))));

  // 最该先做的几件事：**服务端**排好的 top_actions（scoring.top_actions，
  // 与 CLI/HTML 报告同一份排序：严重度 × 影响面）。前端不再自己按
  // 严重级排——两处排法不一样，用户看到的「先做」和报告里的对不上。
  const top = rep.top_actions || [];
  host.append(el("div",{class:"card"},
    el("h2",{},"最该先做的事"),
    top.length ? el("div",{}, ...top.map((i, idx) => el("div",{
        class:"top-item",
        style:"border-top:1px solid var(--line);padding:12px 0"
      },
      el("div",{style:"display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"},
        el("span",{class:"rule-id"}, `${idx+1}. ${i.code}`),
        sevTag(i.severity),
        el("span",{}, i.title)),
      el("div",{class:"mono",style:"color:var(--muted);font-size:11px;margin-top:4px"},
        (i.url || "站点级") + (i.affected_pages ? `　· 影响 ${i.affected_pages} 页` : "")),
      i.impact ? el("p",{style:"margin:6px 0 0"}, i.impact) : "",
      i.fix_hint ? el("p",{style:"margin:6px 0 0"}, el("strong",{},"怎么修："), i.fix_hint) : "",
      i.fix_example ? el("pre",{class:"mono",style:
        "background:var(--bg);border:1px solid var(--line);border-radius:4px;"
        + "padding:8px;overflow-x:auto;margin:6px 0 0;font-size:11px"}, i.fix_example) : "",
      i.description ? el("p",{style:"margin:6px 0 0;color:var(--muted);font-size:12px"}, i.description) : "",
    )))
    : emptyBox("没有待处理问题", "这张清单只覆盖本轮抓到的页面。")));

  // AI 总结：可选功能，失败只空缺，不拖垮主结果
  const ai = el("div",{class:"card"}, el("h2",{},"AI 总结"), loading());
  host.append(ai);
  try {
    const s = await API.aiSummary(site.id);
    ai.textContent = ""; ai.append(el("h2",{},"AI 总结"));
    ai.append(s.summary
      ? el("div",{}, el("div",{class:"mono",style:"color:var(--muted);font-size:11px"},
          `模型 ${s.model || "—"}`), el("p",{style:"white-space:pre-wrap"}, s.summary))
      : el("div",{class:"note"}, s.reason || "未启用 AI 总结。可在扫描时加 --llm-summary，或配置 LLM 端点。"));
  } catch (e) {
    ai.textContent = ""; ai.append(el("h2",{},"AI 总结"), el("div",{class:"note"},
      "AI 总结不可用（", e.message, "）。规则报告不受影响。"));
  }

  /* 托管定时复扫：GET/PUT /schedule 早就在后端了，界面上却没有开关 ——
     「托管」这个能力只能靠 curl 用。接上时顺带把「执行参数在提交这一刻
     定格成快照」这条语义原样说给用户，否则他会以为改站点设置就能改到
     已在跑的复扫上。 */
  const sched = el("div",{class:"card"}, el("h2",{},"托管定时复扫"), loading());
  host.append(sched);

  async function loadSchedule() {
    sched.textContent = "";
    sched.append(el("h2",{},"托管定时复扫"));
    let cur;
    try { cur = await API.schedule(site.id); }
    catch (e) { sched.append(errBox(e)); return; }
    const p = cur.params || {};

    const opts = [[3600,"每小时"],[10800,"每 3 小时"],[21600,"每 6 小时"],
                  [43200,"每 12 小时"],[86400,"每天"],[259200,"每 3 天"],[604800,"每周"]];
    if (cur.interval_s && !opts.some(o => o[0] === cur.interval_s))
      opts.unshift([cur.interval_s, `每 ${cur.interval_s} 秒（现有设置）`]);
    const interval = el("select",{}, ...opts.map(o => el("option",{value:String(o[0])},o[1])));
    if (cur.interval_s) interval.value = String(cur.interval_s);
    const surl = el("input",{value: p.url || `https://${site.domain}`,
      placeholder:"复扫的入口网址"});
    const spages = el("input",{type:"number",value:String(p.max_pages ?? 30),min:"1",max:"500"});
    const sdepth = el("input",{type:"number",value:String(p.max_depth ?? 6),min:"0",max:"20"});
    const smarket = el("select",{}, ...MARKETS.map(([v,l]) => el("option",{value:v},l)));
    smarket.value = (p.markets && p.markets[0]) || (site.markets && site.markets[0]) || "base";
    const srobots = el("input",{type:"checkbox"}); srobots.checked = p.respect_robots !== false;
    const sjs = el("input",{type:"checkbox"}); sjs.checked = !!p.render_js;
    const save = el("button",{class:"btn btn-primary"}, cur.enabled ? "更新托管" : "开启托管");
    const off = el("button",{class:"btn"},"停用托管");
    if (!cur.enabled) off.disabled = true;

    async function putSchedule(body, okMsg) {
      save.disabled = true; off.disabled = true;
      try {
        await API.setSchedule(site.id, body);
        toast(okMsg);
        await loadSchedule();   // 状态与「下次」时间以服务器返回为准，不自算
      } catch (e) { toast(e.message,"err"); save.disabled = false; off.disabled = !cur.enabled; }
    }

    save.addEventListener("click", () => {
      const pages = Number(spages.value), depth = Number(sdepth.value);
      // 空框会被 Number() 变成 0，而这里的 0 是有含义的（深度 0 = 只抓入口页）。
      // 让一个「手滑清空」静默改成物理范围极小的扫描，不如当场挡下来。
      if (!Number.isInteger(pages) || pages < 1 || pages > 500) {
        toast("最大页数得是 1–500 的整数","err"); return;
      }
      if (!Number.isInteger(depth) || depth < 0 || depth > 20) {
        toast("最大深度得是 0–20 的整数（0 = 只抓入口页）","err"); return;
      }
      putSchedule({
        interval_s: Number(interval.value),
        url: surl.value.trim() || null,
        max_pages: pages,
        max_depth: depth,
        markets: [smarket.value],
        respect_robots: srobots.checked,
        render_js: sjs.checked,
      }, cur.enabled ? "已更新托管参数" : "已开启托管：第一次复扫立即安排");
    });
    off.addEventListener("click", () => putSchedule({interval_s: null}, "已停用托管"));

    const human = (opts.find(o => o[0] === cur.interval_s) || [0, "—"])[1];
    sched.append(
      el("p",{class:"page-sub"},
        cur.enabled
          ? el("span",{}, el("span",{class:"pill"},"已托管"),
              `　${human}复扫一次　· 下次 `,
              el("span",{class:"mono"}, fmtTime(cur.next_scan_at)))
          : el("span",{}, el("span",{class:"pill"},"未开启"),
              "　开启后第一次复扫立即安排，之后按所选周期滚动。"),
        // 到期→入队→执行由服务端进程里的调度循环做。进程没在跑（本地起一下
        // 又关掉）就不会有复扫，这条边界写在界面上，不藏在文档里。
        el("div",{class:"note",style:"margin-top:8px"},
          "复扫由服务进程内的调度循环执行：进程停着的时间不会补跑。"
          + "周期下限 1 小时不是技术限制——一次扫描本身要几分钟到几十分钟，"
          + "更短只会让队列里永远耥着一条任务，也是对目标站的负载。"),
        el("div",{class:"note",style:"margin-top:6px"},
          "下面的执行参数在点「开启/更新」这一刻定格成快照：之后改站点设置不会影响已在跑的复扫。")),
      el("div",{class:"fld-row",style:"margin-top:12px"},
        el("div",{class:"fld"}, el("label",{},"复扫周期"), interval),
        el("div",{class:"fld"}, el("label",{},"规则包"), smarket)),
      el("div",{class:"fld"}, el("label",{},"入口网址"), surl),
      el("div",{class:"grid g3"},
        el("div",{class:"fld"}, el("label",{},"最大页数"), spages),
        el("div",{class:"fld"}, el("label",{},"最大深度"), sdepth,
          el("div",{class:"hint"},"0 = 只抓入口页")),
        el("div",{class:"fld"}, el("label",{},"选项"),
          el("div",{class:"btn-row",style:"margin:0"},
            el("label",{class:"chk"}, srobots, "遵守 robots.txt"),
            el("label",{class:"chk"}, sjs, "JS 渲染")))),
      el("div",{class:"btn-row"}, save, off),
      el("div",{class:"note",style:"margin-top:10px"},
        "跑完的复扫会作为新任务出现在「趋势与历史 → 扫描历史」，并推动健康分趋势线。"));
  }

  await loadSchedule();

  if (!total) {
    host.append(el("div",{class:"note"},"本轮未发现问题。注意：报告只覆盖抓取到的页面，覆盖率不足时站点级结论会保持沉默。"));
  }
}

async function tabIssues(host, site) {
  host.textContent = "";

    ...SEV.map(k => el("option",{value:k}, SEV_LABEL[k])));

  async function load() {
    list.textContent = ""; list.append(loading());

    if (stSel.value) q.set("status", stSel.value);

      list.append(el("table",{},
        el("tr",{}, el("th",{},"严重级"), el("th",{},"规则"), el("th",{},"问题"),
          el("th",{},"页面 / 根因"), el("th",{},"状态"), el("th",{},"")),
        ...page.items.map(it => el("tr",{},
          el("td",{}, sevTag(it.severity)),
          el("td",{}, el("span",{class:"rule-id"}, it.code)),
          el("td",{}, it.title, it.occurrences > 1
            ? el("span",{class:"badge-count",style:"margin-left:6px"}, `${it.occurrences} 处`) : null),
          el("td",{class:"mono",style:"word-break:break-all;color:var(--muted)"},
            it.url || "（站点级）",
            it.fingerprint ? el("div",{style:"font-size:11px"}, `根因 ${it.fingerprint.slice(0,12)}…`) : null),
          el("td",{}, el("span",{class:"pill"}, STATUS_LABEL[it.status] || it.status)),
          el("td",{},
            el("div",{class:"btn-row"},
              el("button",{class:"btn btn-sm", onclick: async () => {
                await API.setIssue(site.id, it.id, "fixed"); toast("已标记为已修复"); load();
              }},"已修复"),
              el("button",{class:"btn btn-sm", onclick: async () => {
                await API.setIssue(site.id, it.id, "false_positive"); toast("已标记误报"); load();
              }},"误报"),
              it.fingerprint ? el("button",{class:"btn btn-sm", title:"同根因的全部问题一起标记",
                onclick: async () => {
                  await API.bulkIssue(site.id, it.fingerprint, "acknowledged");
                  toast("同根因问题已批量标记为已知晓"); load();
                }},"同根因·已知晓") : null))))));
    } catch (e) { list.textContent = ""; list.append(errBox(e)); }
  }
  sevSel.addEventListener("change", () => { S.q.severity = sevSel.value; load(); });
  stSel.addEventListener("change", () => { S.q.status = stSel.value; load(); });
  host.append(el("div",{class:"btn-row",style:"margin-bottom:14px"}, sevSel, stSel),
    el("div",{class:"note"},"状态含义：已知晓（看过暂不改）/ 已修复 / 已忽略 / 误报。误报会被记录，用于规则改进。"));
  host.append(list);
  await load();
}

  host.append(el("div",{class:"card"},

    ...SEV.map(k => el("div",{class:"kv"}, el("div",{class:"k"}, SEV_LABEL[k]),

  host.append(el("div",{class:"card"},
    el("h2",{},"一键导出"),
    el("p",{class:"page-sub"},"导出内容为从数据库重建的体检摘要（含扫描历史），文件内已注明口径；扫描现场的完整证据链请在扫描时用 CLI 导出。"),
    el("div",{class:"btn-row",style:"margin-top:12px"},
      el("a",{class:"btn btn-primary", href: API.exportUrl(site.id,"md"), download:""},"Markdown"),
      el("a",{class:"btn", href: API.exportUrl(site.id,"html"), download:""},"HTML（单文件）"),
      el("a",{class:"btn", href: API.exportUrl(site.id,"json"), download:""},"JSON"))));

  /* 整改工单（修复包）：报告回答「哪里不对」，工单回答「下周一改什么」——
     每条问题给「改前 → 改后 + 怎么改」。CLI 的 --fixpack 早就有，界面上
     却连入口都没有，等于把产品从「体检」跨到「执行」的那件交付物藏起来了。 */
  const brand = el("input",{placeholder:"出具方名称，如「某某工作室」（选填）", maxlength:"80"});
  const PACK_FMTS = [["md","Markdown 工单"],["json","JSON"],
                     ["csv","CSV（一行一个处方）"],["diff","unified diff"]];
  const packLinks = PACK_FMTS.map(([f,label]) =>
    el("a",{class:"btn", href:"#"}, label));
  function refreshPackLinks() {
    const b = brand.value.trim();
    packLinks.forEach((a, i) => { a.href = API.fixpackUrl(site.id, PACK_FMTS[i][0], b); });
  }
  brand.addEventListener("input", refreshPackLinks);
  refreshPackLinks();

  host.append(el("div",{class:"card"},
    el("h2",{},"整改工单（修复包）"),
    el("p",{class:"page-sub"},
      "每条问题给「改前 → 改后」的可落地改法，按可信度分档；"
      + "证据不足的一律标成「转人工」，不冒充成能直接抄的处方。"),
    el("div",{class:"fld-row",style:"margin-top:10px"},
      el("div",{class:"fld",style:"flex:1"}, el("label",{},"出具方名称"), brand,
        el("div",{class:"hint"},"只写进 Markdown / JSON 的抬头；CSV 与 diff 没有这个字段。"))),
    el("div",{class:"btn-row"}, ...packLinks),
    el("div",{class:"note",style:"margin-top:12px"},
      "工单是从库里重建的：库里不留图片清单，所以 img_alt 那类处方只有在 CLI 完整扫描时出得来。"
      + "这条边界工单自己也写在「工单说明」里，不靠界面口头声明。"),
    el("div",{class:"note",style:"margin-top:6px"},
      "下载前不需要再生成一次扫描——内容对应当前库里的最新一轮结果；"
      + "想让工单反映刚修完的站点，先重跑一次体检。")));

  if ((rep.issues||[]).length) {
    host.append(el("div",{class:"card"},
      el("h2",{},"问题清单（按根因折叠的完整版见 CLI 报告）"),
      el("table",{},
        el("tr",{}, el("th",{},"严重级"), el("th",{},"规则"), el("th",{},"问题"), el("th",{},"状态")),
        ...rep.issues.map(i => el("tr",{},
          el("td",{}, sevTag(i.severity)),
          el("td",{}, el("span",{class:"rule-id"}, i.code)),
          el("td",{}, i.title),
          el("td",{}, el("span",{class:"pill"}, STATUS_LABEL[i.status] || i.status)))))));
  }
}

/* ── 关键词 ─────────────────────────────────────────── */
async function tabKeywords(host, site) {
  host.textContent = "";
  const seeds = el("input",{placeholder:"种子词，逗号分隔，如 登山鞋, 徒步鞋"});
  const expandBtn = el("button",{class:"btn btn-primary"},"扩展并聚类");
  const list = el("div",{});

  async function load() {
    list.textContent = ""; list.append(loading());
    try {
      const page = await API.keywords(site.id);
      list.textContent = "";
      if (!page.items.length) {
        list.append(emptyBox("还没有关键词","先用种子词扩展一轮。扩展是纯离线的：从本站语料挖词，不需要任何 API key。"));
        return;
      }
      // 按簇分组显示
      const byCluster = new Map();
      for (const k of page.items) {
        const key = k.cluster_id === null || k.cluster_id === undefined ? "—" : String(k.cluster_id);
        if (!byCluster.has(key)) byCluster.set(key, []);
        byCluster.get(key).push(k);
      }
      list.append(el("div",{class:"page-sub",style:"margin-bottom:10px"},
        `共 ${page.total} 个词 / ${byCluster.size} 个簇`));
      for (const [cid, items] of byCluster) {
        list.append(el("div",{class:"card"},
          el("h3",{}, cid === "—" ? "未归簇" : `簇 #${cid}`),
          el("table",{},
            el("tr",{}, el("th",{},"词"), el("th",{},"意图"), el("th",{class:"num"},"得分"), el("th",{},"来源")),
            ...items.map(k => el("tr",{},
              el("td",{}, k.term),
              el("td",{}, k.intent || "—"),
              el("td",{class:"num"}, num(k.score)),
              el("td",{class:"mono"}, k.source || "—"))))));
      }
    } catch (e) { list.textContent = ""; list.append(errBox(e)); }
  }

  expandBtn.addEventListener("click", async () => {
    const ss = seeds.value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
    if (!ss.length) { toast("至少填一个种子词","err"); return; }
    expandBtn.disabled = true;
    try {
      const r = await API.expandKw(site.id, {seeds: ss, market: "base"});
      if (r.status === "ok") toast(`扩展出 ${r.candidates} 个候选 / ${r.clusters} 个簇`);
      else toast(`未扩展：${r.reason || r.status}（这是诚实的空结果，不是故障）`,"err");
      await load();
    } catch (e) { toast(e.message,"err"); }
    finally { expandBtn.disabled = false; }
  });

  host.append(el("div",{class:"card"},
    el("h2",{},"关键词扩展与聚类"),
    el("div",{class:"fld-row"},
      el("div",{class:"fld"}, el("label",{},"种子词"), seeds),
      el("div",{style:"display:flex;align-items:flex-end"}, expandBtn)),
    el("div",{class:"note"},"扩展基于本站语料的词形挖掘 + 聚类，纯离线、结果可复现。没有付费数据源时搜索量字段留空，不填 0。")));
  host.append(list);
  await load();
}

               + "防水登山鞋,1,https://rival.test/shoes,竞品标题,轻量防水",
    send: (text, format) => API.importSerpRaw(site.id, text, format),
    render: (o, r) => {
      o.append(el("div",{class:"stats"},
        el("div",{class:"stat"}, el("div",{class:"k"},"新建词"),
          el("div",{class:"v"}, String(r.keywords_created))),
        el("div",{class:"stat"}, el("div",{class:"k"},"复用词"),
          el("div",{class:"v"}, String(r.keywords_existing))),
        el("div",{class:"stat"}, el("div",{class:"k"},"新增结果"),
          el("div",{class:"v"}, String(r.snapshots_inserted))),
        el("div",{class:"stat"}, el("div",{class:"k"},"更新结果"),
          el("div",{class:"v"}, String(r.snapshots_updated)))));
      // ⚠️ 这个字段是**兜底时刻**，不是「这批的抓取时刻」：文件里写了时间的一组
      // 以文件为准，没写的才按它落库。标签写错就是把 10-20 的数据说成 10-22。
      o.append(el("div",{class:"kv"}, el("div",{class:"k"},"没写抓取时间的那几组按"),
        el("div",{class:"v mono"}, (r.captured_at || "—") + " 落库")),
        el("div",{class:"note"},
          "文件里带了抓取时间的以文件为准；实际落库值看下面那张回读表。"));
      if (r.skipped) o.append(el("div",{class:"note"},
        `${r.skipped} 行缺 keyword / url / position，没入库（缺字段的位次不能猜）。`));
      // warnings 不是错误，但必须说：CLI 有 stderr，界面与 API 没有别的嘴。
      if ((r.warnings || []).length) o.append(el("div",{class:"note warn"},
        el("div",{style:"font-weight:600;margin-bottom:6px"}, "入库了，但你得知道"),
        ...r.warnings.map(w => el("div",{}, w))));
      o.append(el("div",{class:"note"},
        "下面重新生成一次 Brief，竞品维度就会用上这批数据；"
        + "搜索量与曝光不在这份导出里，Brief 也就不会给你那些数字。"));
    },
  }));

  // 回读：「导进来了没有」必须能被用户自己查证，而不是信一句 toast。
  const readBack = el("div",{class:"card"},
    el("h2",{},"库里现有的 SERP 快照"), loading());
  const term = el("input",{placeholder:"填关键词=看该词最近一次抓取；留空=全站最近若干条"});
  const sMarket = el("select",{},
    el("option",{value:"google"},"Google"),
    el("option",{value:"baidu"},"百度"),
    el("option",{value:"base"},"通用"));
  const sLimit = el("select",{},
    ...[10, 25, 50, 100].map(n => el("option",{value:String(n)}, `最多 ${n} 条`)));
  sLimit.value = "25";
  const sBtn = el("button",{class:"btn"},"查询");

  async function loadSerp() {
    readBack.textContent = "";
    readBack.append(el("h2",{},"库里现有的 SERP 快照"),
      el("div",{class:"fld"}, el("label",{},"关键词"), term,
        el("div",{class:"hint"},
          "填了关键词才按市场筛：词库按 (站点, 市场, 词) 存 —— 导入时标 google 的词，"
          + "切到 baidu 去查就是查不到，这不是数据丢了。")),
      el("div",{class:"fld-row"},
        el("div",{class:"fld"}, el("label",{},"市场"), sMarket),
        el("div",{class:"fld"}, el("label",{},"条数"), sLimit)),
      el("div",{class:"btn-row",style:"margin-bottom:12px"}, sBtn));
    const q = new URLSearchParams();
    if (term.value.trim()) { q.set("keyword", term.value.trim()); q.set("market", sMarket.value); }
    q.set("limit", sLimit.value);
    try {
      const page = await API.serp(site.id, "?" + q.toString());
      readBack.append(page.count ? el("table",{},
        el("tr",{}, el("th",{},"关键词"), el("th",{},"市场"), el("th",{class:"num"},"位次"),
          el("th",{},"URL"), el("th",{},"标题"), el("th",{},"抓取时刻")),
        ...page.items.map(i => el("tr",{},
          el("td",{}, i.keyword),
          el("td",{}, el("span",{class:"pill"}, i.market)),
          el("td",{class:"num"}, num(i.position)),
          el("td",{class:"mono",style:"word-break:break-all"}, i.url),
          el("td",{}, i.title || el("span",{class:"pill"},"无标题")),
          el("td",{class:"mono"}, fmtTime(i.captured_at)))))
        : emptyBox("库里还没有匹配的 SERP 快照",
            "上面导入一份导出，或用 CLI：seoclaw serp-import 文件 --db <数据库> --site <域名>"));
      if (page.count && page.captured_at) readBack.append(el("div",{class:"note",style:"margin-top:12px"},
        `共 ${page.count} 条`,
        term.value.trim() ? `　· 该词最近一次抓取：${page.captured_at}` : "　· 全站最近快照，位次来自导入文件原值"));
    } catch (e) {
      readBack.textContent = "";
      readBack.append(el("h2",{},"库里现有的 SERP 快照"), errBox(e));
    }
  }
  sBtn.addEventListener("click", loadSerp);
  term.addEventListener("keydown", ev => { if (ev.key === "Enter") loadSerp(); });
  host.append(readBack);
  await loadSerp();
}

function renderBrief(b) {
  const card = el("div",{class:"card"},
    el("h2",{},"Brief · ", b.keyword),
    el("div",{class:"kv"}, el("div",{class:"k"},"目标页面"), el("div",{class:"v"}, b.target_url)),
    el("div",{class:"kv"}, el("div",{class:"k"},"页面类型"), el("div",{class:"v"}, b.page_type || "—")),
    el("div",{class:"kv"}, el("div",{class:"k"},"意图"), el("div",{class:"v"}, b.intent || "—")));
  // 我方当前排名：后端没数据时给的是 available:false + 原因，
  // 界面必须把原因原样说出来——「—」会被读成「排在最后」，那是两件事。
  const own = b.own_rank || {};
  card.append(el("div",{class:"kv"},
    el("div",{class:"k"},"我方当前排名"),
    el("div",{class:"v"}, own.available
      ? `第 ${own.position} 位${own.as_of ? " · 截至 " + own.as_of : ""}`
      : "不可用：" + (own.reason || "rank_history 里没有该 URL 的记录"))));
  if ((b.title_candidates||[]).length) {
    card.append(el("h3",{},"标题候选"),
      el("ul",{}, ...b.title_candidates.map(t => el("li",{}, t))));
  }
  if (Object.keys(b.serp_common||{}).length) {
    card.append(el("h3",{},"SERP 共性"), el("pre",{}, JSON.stringify(b.serp_common, null, 2)));
  }
  if ((b.opportunities||[]).length) {
    card.append(el("h3",{},"差异化机会"),
      el("ul",{}, ...b.opportunities.map(o => el("li",{}, o && o.text ? o.text : JSON.stringify(o)))));
  }
  if ((b.not_available||[]).length || (b.caveats||[]).length) {
    card.append(el("h3",{},"数据边界（诚实声明）"),
      el("ul",{}, ...(b.not_available||[]).map(x => el("li",{}, x)),
        ...(b.caveats||[]).map(x => el("li",{}, x))));
  }
  return card;
}

/* ── 排名监测 ───────────────────────────────────────── */
async function tabRanks(host, site) {
  host.textContent = "";

  /* 数据入口。告警只能对**已在库里**的数据说话——没有这一卡，
     「排名监测」就是个只能看着的空壳（这条洞 2026-10-18 补了后端、
     2026-10-22 补了 CLI，界面上仍然只有 CLI 用户能用）。 */
  host.append(rawImportCard({
    title: "导入日级排名（Search Console / 排名跟踪器导出）",
    sub: "认得 GSC 风格表头：date / page / average position / clicks / impressions"
       + "（中英文别名都认）。同一 (页面, 日期) 重复导入是当日回补，不会翻倍。",
    placeholder: "date,page,average position,clicks,impressions\n"
               + "2026-10-01,https://example.com/,5,120,3400",
    send: (text) => API.importRankCsv(site.id, text),
    render: (out, r) => {
      out.append(el("div",{class:"stats"},
        el("div",{class:"stat"}, el("div",{class:"k"},"写入/更新"),
          el("div",{class:"v"}, String(r.upserted))),
        el("div",{class:"stat"}, el("div",{class:"k"},"跳过的行"),
          el("div",{class:"v"}, String(r.skipped || 0)))),
        r.errors && r.errors.length ? errLines(r.errors) : el("div",{class:"note"},
          "全部行都入库了。位次留空的行会记成「当天没有排名数据」，"
          + "不是「排第 0 位」——这个区分是跌幅告警的前提。"));
    },
  }));

  // 导入后必须能被用户自己查证：库里现在到底有什么。
  const days = el("select",{},
    ...[7, 30, 90].map(d => el("option",{value:String(d)}, `最近 ${d} 天`)));
  days.value = "30";
  const readBack = el("div",{class:"card"}, el("h2",{},"库里现有的排名"), loading());
  async function loadRanks() {
    readBack.textContent = "";
    readBack.append(el("h2",{},"库里现有的排名"),
      el("div",{class:"fld",style:"max-width:220px"}, el("label",{},"时间范围"), days));
    try {
      const page = await API.rankings(site.id, Number(days.value));
      const nulls = (page.items || []).filter(i => i.position === null).length;
      readBack.append(page.count ? el("table",{},
        el("tr",{}, el("th",{},"日期"), el("th",{},"页面"), el("th",{class:"num"},"位次"),
          el("th",{class:"num"},"点击"), el("th",{class:"num"},"曝光")),
        ...page.items.slice(0, 80).map(i => el("tr",{},
          el("td",{class:"mono"}, i.date),
          el("td",{class:"mono",style:"word-break:break-all"}, i.url),
          el("td",{class:"num"}, i.position === null
            ? el("span",{class:"pill"},"无数据") : num(i.position)),
          el("td",{class:"num"}, num(i.clicks)),
          el("td",{class:"num"}, num(i.impressions)))))
        : emptyBox("库里还没有排名数据",
            "上面导入一份导出，或用 CLI：seoclaw rank-import 文件.csv --db <数据库> --site <域名>"));
      readBack.append(el("div",{class:"note",style:"margin-top:12px"},
        `共 ${page.count} 行（表格最多显示 80 行）`,
        nulls ? `　· 其中 ${nulls} 行位次为空，按「当天没有排名数据」处理` : ""));
    } catch (e) {
      readBack.textContent = "";
      readBack.append(el("h2",{},"库里现有的排名"), errBox(e));
    }
  }
  days.addEventListener("change", loadRanks);
  host.append(readBack);
  await loadRanks();

  const window_days = el("input",{type:"number",value:"30",min:"2",max:"365"});
  const min_drop = el("input",{type:"number",value:"5",min:"0",step:"1"});
  const min_impressions = el("input",{type:"number",value:"10",min:"0"});
  const onlyNew = el("input",{type:"checkbox"});
  const btn = el("button",{class:"btn btn-primary"},"查询跌幅");
  const out = el("div",{});

  btn.addEventListener("click", async () => {
    btn.disabled = true; out.textContent = ""; out.append(loading());
    try {
      const alerts = await API.rankDrops(site.id, {
        window_days: Number(window_days.value)||30,
        min_drop: Number(min_drop.value)||5,
        min_impressions: Number(min_impressions.value)||10,
        only_new: onlyNew.checked,
      });
      out.textContent = "";
      if (!alerts.length) {
        out.append(emptyBox("没有符合条件的跌幅",
          "阈值是「多吵才算吵」的取舍：调低 min_drop / min_impressions 会更敏感。"));
        return;
      }
      out.append(el("table",{},
        el("tr",{}, el("th",{},"结论"), el("th",{class:"num"},"跌幅"),
          el("th",{},"页面"), el("th",{},"")),
        ...alerts.map(a => el("tr",{},
          el("td",{}, a.message),
          el("td",{class:"num"}, `-${a.drop}`),
          el("td",{class:"mono",style:"word-break:break-all"}, a.url),
          el("td",{}, a.alert_key ? el("button",{class:"btn btn-sm", onclick: async () => {
            await API.ackDrops(site.id, [a.alert_key]); toast("已标记看过"); btn.click();
          }},"已看过") : null)))));
    } catch (e) { out.textContent = ""; out.append(errBox(e)); }
    finally { btn.disabled = false; }
  });

  host.append(el("div",{class:"card"},
    el("h2",{},"排名跌幅告警"),
    el("p",{class:"page-sub"},"基于 rank_history 的日级排名数据。三个阈值都显式暴露——告警一多就不叫告警了。"),
    el("div",{class:"grid g3"},
      el("div",{class:"fld"}, el("label",{},"观察窗口（天）"), window_days),
      el("div",{class:"fld"}, el("label",{},"最小跌幅"), min_drop),
      el("div",{class:"fld"}, el("label",{},"最小曝光"), min_impressions)),
    el("div",{class:"btn-row"}, el("label",{class:"chk"}, onlyNew, "只看未确认的"), btn)));
  host.append(out);
  btn.click();
}

async function viewSettings(host) {
  host.textContent = "";
  host.append(el("div",{class:"head"}, el("div",{},
    el("div",{class:"eyebrow"},"Settings"),
    el("h1",{class:"page-title"},"设置"),
    el("p",{class:"page-sub"},"访问钥匙、额度与系统状态。"))));

  // —— 身份与额度 ——
  const meBox = el("div",{class:"card"}, el("h2",{},"身份与额度"), loading());
  host.append(meBox);
  try {
    const me = await API.me();
    meBox.textContent = "";
    meBox.append(el("h2",{},"身份与额度"),
      el("div",{class:"kv"}, el("div",{class:"k"},"归属"), el("div",{class:"v"}, me.owner)),
      el("div",{class:"kv"}, el("div",{class:"k"},"鉴权"),
        el("div",{class:"v"}, me.auth_enabled ? "已开启" : "关闭（单机模式）")),
      el("div",{class:"kv"}, el("div",{class:"k"},"额度"),
        el("div",{class:"v"}, me.quota.enforced
          ? `${me.quota.used} / ${me.quota.limit}` : `${me.quota.used}（不限量）`)));
  } catch (e) {
    meBox.textContent = ""; meBox.append(errBox(e));
  }

  // —— 钥匙 ——
  const keyInput = el("input",{type:"password", placeholder:"sk-seoclaw-…（留空则不带钥匙）"});
  keyInput.value = apiKey();
  const saveKey = el("button",{class:"btn", onclick: () => {
    setApiKey(keyInput.value.trim()); toast("已保存到本机浏览器");
  }},"保存钥匙");
  host.append(el("div",{class:"card"},
    el("h2",{},"访问钥匙"),
    el("p",{class:"page-sub"},"钥匙只存 SHA-256 哈希，明文丢了一定找不回，只能重新签发。存在浏览器 localStorage。"),
    el("div",{class:"fld-row"},
      el("div",{class:"fld"}, el("label",{},"当前钥匙"), keyInput),
      el("div",{style:"display:flex;align-items:flex-end"}, saveKey))));

  const keysBox = el("div",{class:"card"}, el("h2",{},"已签发的钥匙"), loading());
  host.append(keysBox);
  async function loadKeys() {
    keysBox.textContent = ""; keysBox.append(el("h2",{},"已签发的钥匙"));
    try {
      const ks = await API.listKeys();
      if (!ks.length) {
        keysBox.append(emptyBox("一把钥匙都还没签发",
          "单机模式不需要钥匙。开 SaaS（SEO_CLAW_AUTH=on）时才要。",
          el("button",{class:"btn btn-primary", onclick: mint},"+ 签发新钥匙")));
        return;
      }
      keysBox.append(el("table",{},
        el("tr",{}, el("th",{},"名称"), el("th",{},"前缀"), el("th",{},"创建"),
          el("th",{},"最后使用"), el("th",{},"状态"), el("th",{},"")),
        ...ks.map(k => el("tr",{},
          el("td",{}, k.name), el("td",{class:"mono"}, k.key_prefix),
          el("td",{class:"mono"}, fmtTime(k.created_at)),
          el("td",{class:"mono"}, k.last_used_at ? fmtTime(k.last_used_at) : "从未"),
          el("td",{}, el("span",{class:"pill"}, k.revoked ? "已撤销" : "有效")),
          el("td",{}, k.revoked ? null : el("button",{class:"btn btn-sm btn-danger", onclick: async () => {
            await API.revokeKey(k.id); toast("已撤销"); loadKeys();
          }},"撤销"))))),
        el("div",{style:"margin-top:12px"},
          el("button",{class:"btn btn-primary", onclick: mint},"+ 签发新钥匙")));
    } catch (e) { keysBox.textContent = ""; keysBox.append(el("h2",{},"已签发的钥匙"), errBox(e)); }
  }
  async function mint() {
    try {
      const k = await API.createKey({name: "web-" + new Date().toISOString().slice(0,10)});
      const copyBtn = el("button",{class:"btn", onclick: async () => {
        try { await navigator.clipboard.writeText(k.key); toast("已复制"); } catch { toast("复制失败，请手动选中","err"); }
      }},"复制");
      modal("新钥匙（只显示这一次）", el("div",{},
        el("div",{class:"note warn"},"明文只出现这一次。服务端只存哈希，丢了只能重发。"),
        el("pre",{style:"margin:12px 0"}, k.key),
        el("div",{class:"btn-row"}, copyBtn)));
      loadKeys();
    } catch (e) { toast(e.message,"err"); }
  }
  await loadKeys();

  // —— 系统状态 ——
  const hb = el("div",{class:"card"}, el("h2",{},"系统状态"), loading());
  host.append(hb);
  try {
    const h = await API.health();
    hb.textContent = "";
    hb.append(el("h2",{},"系统状态"),
      el("div",{class:"kv"}, el("div",{class:"k"},"服务"), el("div",{class:"v"}, h.ok ? "正常" : "异常")),
      el("div",{class:"kv"}, el("div",{class:"k"},"进程启动"), el("div",{class:"v"}, fmtTime(new Date(h.process_started_at*1000).toISOString()))),
      el("div",{class:"kv"}, el("div",{class:"k"},"代码修改"), el("div",{class:"v"}, fmtTime(new Date(h.code_modified_at*1000).toISOString()))),
      h.stale ? el("div",{class:"note warn",style:"margin-top:10px"},
        "⚠️ 磁盘上的代码比运行中的进程新——看到的可能是旧版本的行为，重启服务后再判断。")
        : el("div",{class:"note",style:"margin-top:10px"},"进程与代码一致。"));
  } catch (e) { hb.textContent = ""; hb.append(el("h2",{},"系统状态"), errBox(e)); }
}

    el("div",{class:"fld"}, el("label",{},"域名"), domain,
      el("div",{class:"hint"},"只填域名即可，无需 https://")),
    el("div",{class:"fld"}, el("label",{},"规则包（Ctrl/⌘ 多选）"), markets));
  const m = modal("接入站点", body);
  const ok = el("button",{class:"btn btn-primary", onclick: async () => {
    const d = domain.value.trim();
    if (!d) { toast("请填域名","err"); return; }
    try {
      const s = await API.createSite({
        domain: d.replace(/^https?:\/\//, "").replace(/\/.*$/, ""),
        markets: Array.from(markets.selectedOptions).map(o => o.value),
      });
      m.close(); toast(`已接入 ${s.domain}`);
      await loadSites(); go(`#/site/${s.id}/overview`);
    } catch (e) { toast(e.message,"err"); }
  }},"接入");
  m.box.querySelector(".foot").prepend(ok);
}

function openScan(site) {
  const market = el("select",{}, MARKETS.map(([v,l]) => el("option",{value:v},l)));
  const maxPages = el("input",{type:"number",value:"100",min:"1",max:"5000"});
  const maxDepth = el("input",{type:"number",value:"6",min:"0",max:"20"});
  const rps = el("input",{type:"number",value:"3",min:"1",max:"50",step:"0.5"});
  const robots = el("input",{type:"checkbox",checked:true});
  const js = el("input",{type:"checkbox"});
  const body = el("div",{},
    el("p",{class:"page-sub"}, `对 ${site.domain} 发起一轮完整扫描并落库。`),
    el("div",{class:"fld-row"},
      el("div",{class:"fld"}, el("label",{},"最大页数"), maxPages),
      el("div",{class:"fld"}, el("label",{},"最大深度"), maxDepth)),
    el("div",{class:"fld-row"},
      el("div",{class:"fld"}, el("label",{},"规则包"), market),
      el("div",{class:"fld"}, el("label",{},"每秒请求"), rps)),
    el("label",{class:"chk"}, robots, "遵守 robots.txt"),
    el("label",{class:"chk"}, js, "JS 渲染"));
  const m = modal("开始体检", body);
  const ok = el("button",{class:"btn btn-primary", onclick: async () => {
    ok.disabled = true;
    try {
      await API.scan(site.id, {
        max_pages: Number(maxPages.value)||100,
        max_depth: Number(maxDepth.value)||6,
        per_domain_rps: Number(rps.value)||3,
        markets: [market.value],
        respect_robots: robots.checked,
        render_js: js.checked,
      });
      m.close(); toast("扫描已启动");
      go(`#/site/${site.id}/trend`);
    } catch (e) { toast(e.message,"err"); ok.disabled = false; }
  }},"开始体检");
  m.box.querySelector(".foot").prepend(ok);
}

async function deleteSite(site) {
  const body = el("div",{},
    el("p",{}, `删除 ${site.domain} 及其全部扫描记录、问题、关键词。此操作不可恢复。`));
  const m = modal("删除站点", body);
  const ok = el("button",{class:"btn btn-danger", onclick: async () => {
    try {
      await API.deleteSite(site.id);
      m.close(); toast(`已删除 ${site.domain}`);
      await loadSites(); go("#/dashboard");
    } catch (e) { toast(e.message,"err"); }
  }},"确认删除");
  m.box.querySelector(".foot").prepend(ok);
}

/* ══════════════════════════════════════════════════════════
   渲染入口
   ══════════════════════════════════════════════════════════ */
async function render() {
  const r = parseRoute();
  renderSide();
  const host = $("#main");
  host.textContent = "";
  if (r.head === "scan")          viewScanForm(host);
  else if (r.head === "site" && r.id) await viewSite(host, r.id, r.tab);
  else if (r.head === "settings") viewSettings(host);
  else await viewDashboard(host);
}

async function loadSites() {
  try { S.sites = await API.sites(); } catch { S.sites = []; }
  renderSide();
}

/* 启动 */
$("#btnAdd").addEventListener("click", openAdd);
$("#btnSettings").addEventListener("click", () => go("#/settings"));
(async function boot() {
  await loadSites();
  await render();
})();
</script>
</body>
</html>
